<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="referrer" content="no-referrer">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simulador del Examen Final · Proyecto 3</title>
  <style>
    :root { --ink:#0f172a; --muted:#475569; --primary:#2563eb; --ok:#059669; --err:#dc2626; }
    * { box-sizing:border-box; margin:0; padding:0; user-select:none !important; -webkit-user-select:none !important; -webkit-touch-callout:none !important; -webkit-tap-highlight-color:transparent !important; }
    body { font-family:'Comic Neue','Fredoka','Lexend','Comic Sans MS','Segoe UI',sans-serif; background:linear-gradient(160deg,#0f172a 0%,#1e3a8a 100%); color:#f8fafc; min-height:100vh; padding:0.65rem 0.9rem; overflow-x:hidden; }
    .app-wrap { max-width:1220px; margin:0 auto; display:flex; flex-direction:column; gap:0.55rem; }
    .topbar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:0.5rem; background:rgba(15,23,42,0.88); border:1px solid rgba(96,165,250,0.35); border-radius:14px; padding:0.5rem 0.85rem; }
    .topbar-left, .topbar-right { display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; }
    .btn-nav { background:#334155; color:#fff; border:1.5px solid rgba(255,255,255,0.2); border-radius:10px; padding:0.4rem 0.8rem; font-family:inherit; font-size:0.86rem; font-weight:800; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:0.35rem; min-height:38px; }
    .btn-nav:hover { background:#475569; }
    .btn-reset-run { background:#dc2626; border-color:#fca5a5; }
    .btn-reset-run:hover { background:#b91c1c; }
    .badge-sim { background:#dbeafe; color:#1e40af; font-weight:900; font-size:0.84rem; padding:0.3rem 0.7rem; border-radius:999px; }
    .pill-progress { background:#1e293b; border:1.5px solid #60a5fa; color:#dbeafe; padding:0.3rem 0.75rem; border-radius:999px; font-weight:800; font-size:0.85rem; }
    .btn-sound { background:rgba(16,185,129,0.2); border:1.5px solid rgba(16,185,129,0.5); color:#a7f3d0; border-radius:10px; padding:0.35rem 0.75rem; font-family:inherit; font-weight:800; cursor:pointer; min-height:38px; }
    .btn-sound.muted { background:#334155; border-color:#64748b; color:#cbd5e1; }

    .hud-row { display:grid; grid-template-columns:1fr auto; gap:0.55rem; align-items:center; }
    @media (max-width:900px) { .hud-row { grid-template-columns:1fr; } }
    .q-strip { display:flex; flex-wrap:wrap; gap:0.3rem; background:rgba(15,23,42,0.76); border:1px solid rgba(255,255,255,0.12); border-radius:12px; padding:0.4rem 0.6rem; align-items:center; }
    .q-dot { width:32px; height:32px; border-radius:8px; border:2px solid #475569; background:#1e293b; color:#cbd5e1; font-family:inherit; font-weight:900; font-size:0.82rem; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; transition:all 0.15s; }
    .q-dot.current { border-color:#f59e0b; background:#fef3c7; color:#92400e; transform:scale(1.08); }
    .q-dot.done-ok { border-color:#10b981; background:#059669; color:#ffffff; }
    .q-dot.done-err { border-color:#ef4444; background:#991b1b; color:#fee2e2; }
    .nem-live { display:flex; gap:0.35rem; flex-wrap:wrap; background:rgba(15,23,42,0.76); border:1px solid rgba(255,255,255,0.12); border-radius:12px; padding:0.4rem 0.65rem; font-size:0.78rem; font-weight:800; }
    .nem-pill { padding:0.2rem 0.55rem; border-radius:8px; background:#1e293b; border:1px solid #475569; }

    .stage-card { background:#ffffff; color:var(--ink); border-radius:18px; padding:1rem 1.15rem; box-shadow:0 14px 34px rgba(0,0,0,0.34); border-top:5px solid #2563eb; }
    .stage-meta { display:flex; align-items:center; justify-content:space-between; gap:0.5rem; margin-bottom:0.6rem; flex-wrap:wrap; border-bottom:2px dashed #cbd5e1; padding-bottom:0.45rem; }
    .campo-tag { background:#dbeafe; color:#1e40af; padding:0.22rem 0.7rem; border-radius:999px; font-size:0.8rem; font-weight:900; }
    .format-tag { background:#fef3c7; color:#92400e; border:1px solid #f59e0b; padding:0.2rem 0.65rem; border-radius:999px; font-size:0.78rem; font-weight:900; }

    .q-split { display:grid; grid-template-columns:310px 1fr; gap:1rem; align-items:start; }
    @media (max-width:860px) { .q-split { grid-template-columns:1fr; } }

    .visual-panel { background:linear-gradient(145deg,#f8fafc 0%,#dbeafe 100%); border:2px solid #93c5fd; border-radius:16px; padding:0.8rem; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.5rem; text-align:center; min-height:210px; }
    .visual-panel img.hero-img { width:135px; height:135px; object-fit:contain; border-radius:12px; background:#fff; padding:5px; border:2px solid #cbd5e1; }
    .visual-row-imgs { display:flex; gap:0.4rem; justify-content:center; flex-wrap:wrap; }
    .visual-row-imgs img { width:72px; height:72px; object-fit:contain; border-radius:10px; background:#fff; padding:4px; border:2px solid #cbd5e1; }
    .visual-caption { font-size:0.84rem; font-weight:800; color:#1e3a8a; background:#fff; padding:0.3rem 0.6rem; border-radius:8px; border:1.5px solid #93c5fd; width:100%; }

    .stage-prompt { font-size:1.14rem; font-weight:900; color:#0f172a; margin-bottom:0.65rem; line-height:1.3; }

    .options-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:0.55rem; }
    @media (max-width:560px) { .options-grid { grid-template-columns:1fr; } }
    .opt-btn { background:#f8fafc; border:2.5px solid #cbd5e1; border-radius:12px; padding:0.65rem 0.8rem; font-family:inherit; font-size:0.98rem; font-weight:800; color:#0f172a; text-align:left; cursor:pointer; min-height:52px; display:flex; align-items:center; gap:0.55rem; transition:all 0.12s; }
    .opt-btn:hover:not(:disabled) { border-color:#2563eb; background:#eff6ff; }
    .opt-btn:disabled { cursor:default; }
    .exam-box { width:24px; height:24px; border:2.5px solid #334155; border-radius:6px; background:#fff; display:inline-flex; align-items:center; justify-content:center; font-weight:900; font-size:1rem; flex-shrink:0; }
    .opt-btn.picked { border-color:#2563eb; background:#dbeafe; }
    .opt-btn.picked .exam-box { background:#2563eb; color:#fff; border-color:#2563eb; }
    .opt-btn.selected-correct { border-color:#059669 !important; background:#d1fae5 !important; color:#065f46 !important; }
    .opt-btn.selected-correct .exam-box { background:#059669 !important; color:#fff !important; border-color:#059669 !important; }
    .opt-btn.selected-wrong { border-color:#dc2626 !important; background:#fee2e2 !important; color:#991b1b !important; }
    .opt-btn.selected-wrong .exam-box { background:#dc2626 !important; color:#fff !important; border-color:#dc2626 !important; }

    .match-columns { display:grid; grid-template-columns:1fr 1fr; gap:0.65rem; }
    .match-col { display:flex; flex-direction:column; gap:0.45rem; }
    .match-btn { background:#f8fafc; border:2.5px solid #94a3b8; border-radius:11px; padding:0.55rem 0.75rem; font-family:inherit; font-size:0.92rem; font-weight:800; color:#0f172a; text-align:left; cursor:pointer; min-height:46px; display:flex; align-items:center; justify-content:space-between; gap:0.4rem; }
    .match-btn.active { border-color:#2563eb; background:#dbeafe; box-shadow:0 0 0 3px rgba(37,99,235,0.2); }
    .match-btn.paired-ok { border-color:#059669; background:#d1fae5; color:#065f46; cursor:default; }
    .match-btn.paired-err { border-color:#dc2626; background:#fee2e2; color:#991b1b; cursor:default; }

    /* SEMÁFORO DE 3 SITUACIONES (REACTIVOS 12 A 14 DEL EXAMEN IMPRESO) */
    .traffic-table { display:flex; flex-direction:column; gap:0.5rem; }
    .traffic-row { display:flex; align-items:center; justify-content:space-between; gap:0.65rem; background:#f8fafc; border:2px solid #cbd5e1; border-radius:12px; padding:0.55rem 0.8rem; font-weight:800; font-size:0.93rem; flex-wrap:wrap; }
    .traffic-btns { display:flex; gap:0.35rem; }
    .t-pill { border:2px solid #94a3b8; background:#fff; border-radius:999px; padding:0.3rem 0.65rem; font-family:inherit; font-size:0.82rem; font-weight:900; cursor:pointer; }
    .t-pill.sel-verde { background:#dcfce7; border-color:#16a34a; color:#14532d; }
    .t-pill.sel-amarillo { background:#fef3c7; border-color:#d97706; color:#78350f; }
    .t-pill.sel-rojo { background:#fee2e2; border-color:#dc2626; color:#991b1b; }

    .exam-line-box { background:#f8fafc; border:2px solid #cbd5e1; border-radius:14px; padding:0.85rem 1rem; font-size:1.12rem; font-weight:800; margin-bottom:0.65rem; line-height:1.6; }
    .line-slot { display:inline-block; min-width:140px; border-bottom:3px solid #0f172a; padding:0 0.5rem; text-align:center; color:#1d4ed8; font-weight:900; background:#dbeafe; border-radius:6px 6px 0 0; margin:0 0.25rem; }
    .word-bank { display:flex; flex-wrap:wrap; gap:0.5rem; }
    .word-chip { background:#fff; border:2.5px solid #64748b; border-radius:10px; padding:0.45rem 0.9rem; font-family:inherit; font-size:1rem; font-weight:900; cursor:pointer; color:#0f172a; }
    .word-chip.active { border-color:#2563eb; background:#dbeafe; color:#1e40af; }

    .token-box { background:#f8fafc; border:2.5px solid #cbd5e1; border-radius:14px; padding:0.85rem; display:flex; flex-wrap:wrap; gap:0.4rem; align-items:center; font-size:1.12rem; font-weight:800; }
    .word-token { background:#fff; border:2.5px solid #94a3b8; border-radius:10px; padding:0.4rem 0.7rem; font-family:inherit; font-size:1.08rem; font-weight:800; cursor:pointer; color:#0f172a; }
    .word-token.marked-red { border-color:#dc2626; background:#fef2f2; }
    .red-cap { color:#dc2626; font-weight:900; font-size:1.18rem; text-decoration:underline; }
    .comma-slot { width:36px; height:38px; border-radius:9px; border:2.5px dashed #64748b; background:#fff; font-family:inherit; font-size:1.25rem; font-weight:900; color:#64748b; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
    .comma-slot.active { border:2.5px solid #dc2626; background:#fef2f2; color:#dc2626; }

    /* TALLER MATEMÁTICO M7 COPIADO DE SUITE PENSAMIENTO MATEMÁTICO */
    .m7-step-box { background:#f8fafc; border:2px solid #cbd5e1; border-radius:14px; padding:0.7rem 0.85rem; margin-bottom:0.55rem; }
    .m7-step-title { font-size:0.84rem; font-weight:900; text-transform:uppercase; color:#1e40af; margin-bottom:0.4rem; display:flex; align-items:center; justify-content:space-between; }
    .m7-chips-row { display:flex; flex-wrap:wrap; gap:0.45rem; }
    .m7-data-chip { background:#fff; border:2.5px solid #94a3b8; border-radius:10px; padding:0.4rem 0.75rem; font-family:inherit; font-size:0.9rem; font-weight:800; cursor:pointer; display:inline-flex; align-items:center; gap:0.35rem; color:#0f172a; }
    .m7-data-chip.useful { border-color:#16a34a; background:#dcfce7; color:#14532d; }
    .m7-data-chip.trampa { border-color:#dc2626; background:#fee2e2; color:#991b1b; text-decoration:line-through; }

    .workbench-wrap { display:grid; grid-template-columns:auto 1fr; gap:0.85rem; align-items:center; }
    @media (max-width:620px) { .workbench-wrap { grid-template-columns:1fr; } }
    .cdu-grid { border-collapse:separate; border-spacing:4px; margin:0 auto; background:#e2e8f0; padding:6px; border-radius:12px; border:2px solid #64748b; }
    .cdu-grid th { padding:0.3rem 0.55rem; border-radius:7px; font-size:0.92rem; font-weight:900; text-align:center; }
    .th-c { background:#fef08a; color:#854d0e; border:1.5px solid #ca8a04; }
    .th-d { background:#fee2e2; color:#991b1b; border:1.5px solid #dc2626; }
    .th-u { background:#dbeafe; color:#1e40af; border:1.5px solid #2563eb; }
    .cdu-cell { width:46px; height:44px; background:#fff; border:2.5px dashed #94a3b8; border-radius:8px; text-align:center; vertical-align:middle; font-size:1.25rem; font-weight:900; color:#0f172a; cursor:pointer; }
    .cdu-cell.carry-cell { height:32px; font-size:0.95rem; background:#fefce8; border-color:#eab308; color:#b45309; }
    .cdu-cell.sign-cell { background:#eff6ff; border-color:#2563eb; color:#1d4ed8; }
    .cdu-cell.active-target { border:3px solid #2563eb !important; background:#eff6ff !important; box-shadow:0 0 0 3px rgba(37,99,235,0.2); }
    .cdu-cell.filled { border-style:solid; border-color:#334155; }
    .cdu-cell.result-cell { border-top:3px solid #0f172a; background:#f0fdf4; border-color:#16a34a; }

    .digit-palette { display:flex; flex-wrap:wrap; gap:0.35rem; justify-content:center; background:#fff; border:2px solid #cbd5e1; border-radius:12px; padding:0.55rem; }
    .digit-btn { width:42px; height:42px; border-radius:10px; border:2px solid #334155; background:#f8fafc; font-family:inherit; font-size:1.18rem; font-weight:900; color:#0f172a; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
    .digit-btn:hover:not(:disabled) { background:#dbeafe; border-color:#2563eb; transform:scale(1.06); }
    .digit-btn.sign-plus { background:#dbeafe; color:#1d4ed8; border-color:#2563eb; }
    .digit-btn.sign-minus { background:#fee2e2; color:#dc2626; border-color:#dc2626; }
    .digit-btn.clear-btn { width:auto; padding:0 0.65rem; font-size:0.85rem; background:#f1f5f9; color:#475569; }

    .feedback-box { margin-top:0.55rem; padding:0.6rem 0.85rem; border-radius:11px; font-weight:800; font-size:0.9rem; display:none; }
    .feedback-box.ok { display:block; background:#d1fae5; color:#065f46; border:2px solid #059669; }
    .feedback-box.err { display:block; background:#fee2e2; color:#991b1b; border:2px solid #dc2626; }
    .stage-footer { margin-top:0.65rem; display:flex; justify-content:space-between; align-items:center; gap:0.5rem; flex-wrap:wrap; border-top:1.5px solid #e2e8f0; padding-top:0.55rem; }
    .btn-primary { background:#2563eb; color:#fff; border:none; border-radius:11px; padding:0.55rem 1.1rem; font-family:inherit; font-size:0.94rem; font-weight:900; cursor:pointer; min-height:42px; }
    .btn-primary:disabled { opacity:0.45; cursor:not-allowed; }
    .btn-grade { background:#059669; color:#fff; border:none; border-radius:11px; padding:0.55rem 1.15rem; font-family:inherit; font-size:0.95rem; font-weight:900; cursor:pointer; min-height:42px; box-shadow:0 4px 12px rgba(5,150,105,0.3); }
    .btn-grade:disabled { opacity:0.4; cursor:not-allowed; box-shadow:none; }
    .btn-sec { background:#e2e8f0; color:#0f172a; border:none; border-radius:11px; padding:0.5rem 0.95rem; font-family:inherit; font-size:0.88rem; font-weight:800; cursor:pointer; min-height:42px; }

    .lock-banner { background:#fffbeb; border:2.5px solid #f59e0b; border-radius:16px; padding:1rem 1.15rem; color:#78350f; margin-bottom:0.85rem; }
    .req-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:0.65rem; margin:0.85rem 0; }
    .req-card { display:flex; flex-direction:column; justify-content:space-between; gap:0.6rem; padding:0.85rem 1rem; border-radius:14px; border:2px solid #cbd5e1; background:#f8fafc; }
    .req-card.done { border-color:#059669; background:#ecfdf5; }
    .req-card.pending { border-color:#f59e0b; background:#fffbeb; }
    .req-go { background:#2563eb; color:#fff; text-decoration:none; padding:0.5rem 0.85rem; border-radius:10px; font-weight:800; font-size:0.88rem; text-align:center; }
    .campos-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:0.6rem; margin:0.8rem 0; }
    .campo-box { background:#f8fafc; border:2px solid #cbd5e1; border-radius:14px; padding:0.75rem; }
  </style>
</head>
<body>
  <div class="app-wrap">
    <div class="topbar">
      <div class="topbar-left">
        <a class="btn-nav" href="../../index.html">⬅ Portal</a>
        <span class="badge-sim">📝 Examen Sumativo Interactivo · Proyecto 3 (1 intento por reactivo)</span>
      </div>
      <div class="topbar-right">
        <span class="pill-progress" id="pillProgress">Verificando...</span>
        <button type="button" class="btn-nav btn-reset-run" id="btnResetRun" style="display:none;" onclick="startExam()">🔄 Reiniciar desde 0 (Nuevos datos)</button>
        <button type="button" class="btn-sound" id="btnSound" onclick="toggleSound()">🔊 Sonido</button>
      </div>
    </div>

    <div class="hud-row" id="hudRow" style="display:none;">
      <div class="q-strip" id="qStrip"></div>
      <div class="nem-live" id="nemLive"></div>
    </div>

    <div class="stage-card" id="stageContainer"></div>
  </div>

  <script>
    window.addEventListener('contextmenu', e => { e.preventDefault(); return false; }, { capture: true, passive: false });
    document.addEventListener('contextmenu', e => { e.preventDefault(); return false; }, { capture: true, passive: false });
    document.oncontextmenu = () => false;

    const AULA_PROGRESS_KEY = 'aula3a_pp_progress_v1';
    const PROJ_KEY = 'p3';
    const REQUIRED_PPS = [
      { id: 'simulador_sistema_locomotor', title: '🦴 El Cuerpo Humano (Sistema Locomotor)', href: '../simulador_sistema_locomotor/index.html' },
      { id: 'semaforo_decisiones_riesgos', title: '🚦 Semáforo de Decisiones (Prevención)', href: '../semaforo_decisiones_riesgos/index.html' },
      { id: 'causa_efecto_salud_invierno', title: '🌡️ Causa y Efecto: Salud (Cartilla y Tríptico)', href: '../causa_efecto_salud_invierno/index.html' }
    ];

    let teacherBypass = false;
    try {
      const params = new URLSearchParams(window.location.search);
      if (params.get('docente') === '1') teacherBypass = true;
    } catch (e) {}

    function readAulaProgress() {
      try {
        const parsed = JSON.parse(localStorage.getItem(AULA_PROGRESS_KEY) || '{}');
        if (!parsed || typeof parsed !== 'object') return { schemaVersion: 1, projects: {} };
        if (!parsed.projects || typeof parsed.projects !== 'object') parsed.projects = {};
        return parsed;
      } catch (e) { return { schemaVersion: 1, projects: {} }; }
    }

    function saveExamProgress(score, total) {
      const data = readAulaProgress();
      if (!data.projects[PROJ_KEY]) data.projects[PROJ_KEY] = { pps: {}, exam: null };
      const prev = data.projects[PROJ_KEY].exam || {};
      const newPct = total > 0 ? Math.round((score / total) * 100) : 0;
      const nowIso = new Date().toISOString();
      data.projects[PROJ_KEY].exam = {
        attempts: (Number(prev.attempts) || 0) + 1,
        bestPct: Math.max(Number(prev.bestPct) || 0, newPct),
        bestScore: Math.max(Number(prev.bestScore) || 0, score),
        total,
        lastPlayedAt: nowIso
      };
      try { localStorage.setItem(AULA_PROGRESS_KEY, JSON.stringify(data)); } catch (e) {}
      return data.projects[PROJ_KEY].exam;
    }

    let sharedAudioCtx = null, soundEnabled = true;
    function getAudioCtx() { const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return null; if (!sharedAudioCtx) sharedAudioCtx = new Ctx(); return sharedAudioCtx; }
    function playSfx(kind) {
      if (!soundEnabled) return; const ctx = getAudioCtx(); if (!ctx) return;
      const run = () => { try { const now = ctx.currentTime, notes = kind === 'ok' ? [[523.25,0,0.08],[659.25,0.07,0.1]] : kind === 'err' ? [[240,0,0.12],[196,0.09,0.14]] : kind === 'lock' ? [[310,0,0.09],[260,0.08,0.12]] : kind === 'win' ? [[523.25,0,0.09],[659.25,0.08,0.09],[783.99,0.16,0.16]] : [[560,0,0.05]]; notes.forEach(([f,o,d])=>{ const osc=ctx.createOscillator(),g=ctx.createGain(); osc.type=(kind==='err'||kind==='lock')?'triangle':'sine'; osc.frequency.setValueAtTime(f,now+o); g.gain.setValueAtTime(0.001,now+o); g.gain.linearRampToValueAtTime(0.08,now+o+0.01); g.gain.exponentialRampToValueAtTime(0.0008,now+o+d); osc.connect(g); g.connect(ctx.destination); osc.start(now+o); osc.stop(now+o+d+0.01); }); } catch(e){} };
      if (ctx.state === 'suspended') ctx.resume().then(run).catch(()=>{}); else run();
    }
    function initUiClickSfx() {
      if (window.__uiClickSfxBound) return; window.__uiClickSfxBound = true;
      document.addEventListener('pointerdown', (e) => { const btn = e.target && e.target.closest ? e.target.closest('button, a.btn-nav, a.req-go') : null; if (btn && !btn.disabled) playSfx('tap'); }, { capture: true, passive: true });
    }
    function toggleSound() { soundEnabled = !soundEnabled; const b = document.getElementById('btnSound'); b.textContent = soundEnabled ? '🔊 Sonido' : '🔇 Mudo'; b.classList.toggle('muted', !soundEnabled); }
    function shuffleArray(arr) { const c = arr.slice(); for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; } return c; }
    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function buildDynamicExamQuestions() {
      // Datos dinámicos para gráfica de barras, suma y resta con canje
      const fManos = randInt(12, 16);
      const fCodo = randInt(6, 9);
      const fAbrigo = randInt(10, 11);

      // Suma con llevada (3 cifras + 3 cifras)
      const s1C = randInt(3, 4), s1D = randInt(5, 8), s1U = randInt(6, 9);
      const vac1 = s1C * 100 + s1D * 10 + s1U;

    let deck = [], idx = 0, answersState = [];

    function unlockAsTeacher() {
      teacherBypass = true;
      startExam();
    }

    function checkUnlockAndStart() {
      const data = readAulaProgress();
      const pps = (data.projects[PROJ_KEY] && data.projects[PROJ_KEY].pps) || {};
      const missing = REQUIRED_PPS.filter(r => !(pps[r.id] && pps[r.id].completed));
      if (missing.length > 0 && !teacherBypass) {
        playSfx('lock');
        document.getElementById('hudRow').style.display = 'none';
        document.getElementById('btnResetRun').style.display = 'none';
        document.getElementById('pillProgress').textContent = `🔒 Bloqueado (${REQUIRED_PPS.length - missing.length}/${REQUIRED_PPS.length} juegos)`;
        document.getElementById('stageContainer').innerHTML = `
          <div>
            <div class="lock-banner">
              <h2 style="font-size:1.25rem;margin-bottom:0.3rem;">🔒 Completa primero tus 3 juegos del Proyecto 3</h2>
              <p style="font-size:0.92rem;">Para desbloquear el Simulador del Examen Final, juega y logra <strong>5 aciertos</strong> en cada uno de los 3 juegos del proyecto:</p>
            </div>
            <div class="req-list">
              ${REQUIRED_PPS.map(r => {
                const st = pps[r.id];
                const isDone = Boolean(st && st.completed);
                return `
                  <div class="req-card ${isDone ? 'done' : 'pending'}">
                    <div>
                      <div style="font-weight:900; font-size:1rem;">${isDone ? '✅' : '⏳'} ${r.title}</div>
                      <div style="font-size:0.85rem; color:#475569; margin-top:0.2rem;">${isDone ? 'Juego completado' : 'Pendiente por completar'}</div>
                    </div>
                    <a class="req-go" href="${r.href}">${isDone ? 'Jugar de nuevo ➔' : 'Ir al juego ➔'}</a>
                  </div>
                `;
              }).join('')}
            </div>
            <div class="stage-footer">
              <a class="btn-nav" href="../../index.html" style="background:#1e293b;">⬅ Volver al Portal</a>
              <button type="button" class="btn-sec" onclick="unlockAsTeacher()">👨‍🏫 Modo Docente: Practicar en Pantalla ➔</button>
            </div>
          </div>
        `;
        return;
      }
      startExam();
    }

    function startExam() {
      deck = buildDynamicExamQuestions();
      idx = 0;
      answersState = deck.map(q => ({
        attempted: false,
        earnedPts: 0,
        maxPts: q.pts || 1,
        feedbackMsg: '',
        isOk: false
      }));
      document.getElementById('hudRow').style.display = 'grid';
      document.getElementById('btnResetRun').style.display = 'inline-flex';
      renderQ();
    }

    function getTotalEarned() { return answersState.reduce((acc, s) => acc + s.earnedPts, 0); }
    function getTotalMax() { return answersState.reduce((acc, s) => acc + s.maxPts, 0); }

    function renderHud() {
      const strip = document.getElementById('qStrip');
      strip.innerHTML = deck.map((_, i) => {
        const st = answersState[i];
        let cls = 'q-dot';
        if (i === idx) cls += ' current';
        else if (st.attempted) cls += st.isOk ? ' done-ok' : ' done-err';
        return `<button type="button" class="${cls}" onclick="goToQ(${i})" title="Bloque ${i + 1}">${i + 1}</button>`;
      }).join('');

      let leng = 0, sab = 0, eti = 0, hum = 0;
      deck.forEach((q, i) => {
        const pts = answersState[i].earnedPts;
        if (q.campo.includes('Lenguajes')) leng += pts;
        else if (q.campo.includes('Saberes')) sab += pts;
        else if (q.campo.includes('Ética')) eti += pts;
        else hum += pts;
      });
      document.getElementById('nemLive').innerHTML = `
        <span class="nem-pill">🔴 Lenguajes: ${leng}/10</span>
        <span class="nem-pill">🔵 Saberes: ${sab}/11</span>
        <span class="nem-pill">🟢 Ética: ${eti}/3</span>
        <span class="nem-pill">🟣 Humano: ${hum}/6</span>
        <span class="nem-pill" style="background:#1d4ed8;border-color:#93c5fd;color:#fff;">TOTAL: ${getTotalEarned()} / ${getTotalMax()}</span>
      `;
      document.getElementById('pillProgress').textContent = `Bloque ${idx + 1}/${deck.length} · Aciertos: ${getTotalEarned()}/${getTotalMax()}`;
    }

    function goToQ(newIdx) {
      if (newIdx < 0 || newIdx >= deck.length) return;
      idx = newIdx;
      renderQ();
    }

    function finalizeAttempt(isFullOk, earnedPts, msg) {
      const st = answersState[idx];
      if (st.attempted) return;
      st.attempted = true;
      st.isOk = isFullOk;
      st.earnedPts = earnedPts;
      st.feedbackMsg = msg;
      playSfx(isFullOk ? 'ok' : 'err');
      renderQ();
    }

    function renderQ() {
      renderHud();
      const q = deck[idx];
      const st = answersState[idx];

      document.getElementById('stageContainer').innerHTML = `
        <div class="stage-meta">
          <span class="campo-tag">${q.campo}</span>
          <span class="format-tag">${q.formatLabel}</span>
          <span style="font-weight:900; font-size:0.86rem; color:${st.attempted ? (st.isOk ? '#059669' : '#dc2626') : '#1e40af'};">
            ${st.attempted ? (st.isOk ? `✅ Acreditado (${st.earnedPts}/${st.maxPts})` : `❌ Intento agotado (${st.earnedPts}/${st.maxPts}) — Reinicia desde 0 para reintentar`) : '⚡ Tienes 1 solo intento en esta corrida'}
          </span>
        </div>
        <div class="q-split">
          <div class="visual-panel">${q.visualHtml}</div>
          <div>
            <h2 class="stage-prompt">${q.prompt}</h2>
            <div id="qBody"></div>
            <div id="feedbackBox" class="feedback-box ${st.attempted ? (st.isOk ? 'ok' : 'err') : ''}">${st.attempted ? st.feedbackMsg : ''}</div>
          </div>
        </div>
        <div class="stage-footer">
          <button type="button" class="btn-sec" onclick="goToQ(${idx - 1})" ${idx === 0 ? 'disabled' : ''}>⬅ Anterior</button>
          <div id="stageActionSlot"></div>
          ${idx + 1 < deck.length
            ? `<button type="button" class="btn-primary" onclick="goToQ(${idx + 1})">Siguiente ➔</button>`
            : `<button type="button" class="btn-primary" style="background:#059669;" onclick="renderSummary()">📊 Finalizar y Ver Boleta NEM ➔</button>`}
        </div>
      `;

      if (q.type === 'mcq') renderMcq(q, st);
      else if (q.type === 'multicheck') renderMultiCheck(q, st);
      else if (q.type === 'match') renderMatch(q, st);
      else if (q.type === 'traffic') renderTraffic(q, st);
      else if (q.type === 'wordfill') renderWordFill(q, st);
      else if (q.type === 'commagaps') renderCommaGaps(q, st);
      else if (q.type === 'redcaps') renderRedCaps(q, st);
      else if (q.type === 'mathm7') renderMathM7(q, st);
    }

    function renderMcq(q, st) {
      const body = document.getElementById('qBody');
      if (!q._opts) q._opts = shuffleArray(q.options);
      const opts = q._opts;
      body.innerHTML = `<div class="options-grid">${opts.map((o, i) => {
        let cls = 'opt-btn', boxTxt = '';
        if (st.attempted) {
          if (o.correct) { cls += ' selected-correct'; boxTxt = '✓'; }
          else if (q._pickedIdx === i) { cls += ' selected-wrong'; boxTxt = '✗'; }
        }
        return `<button type="button" class="${cls}" ${st.attempted ? 'disabled' : ''} data-i="${i}">
          <span class="exam-box">${boxTxt}</span>
          <span>${o.text}</span>
        </button>`;
      }).join('')}</div>`;
      if (st.attempted) return;
      body.querySelectorAll('.opt-btn').forEach((btn, i) => btn.addEventListener('click', () => {
        q._pickedIdx = i;
        const isOk = Boolean(opts[i].correct);
        const rightTxt = opts.find(x => x.correct).text;
        finalizeAttempt(isOk, isOk ? q.pts : 0, isOk ? `✅ ¡Correcto! ${q.okMsg}` : `❌ Incorrecto (1 intento por corrida). La respuesta correcta era: «${rightTxt}».`);
      }));
    }

    function renderMultiCheck(q, st) {
      const body = document.getElementById('qBody');
      if (!q._opts) q._opts = shuffleArray(q.options);
      if (!q._pickedSet) q._pickedSet = new Set();
      const opts = q._opts, picked = q._pickedSet;

      function draw() {
        body.innerHTML = `<div class="options-grid">${opts.map((o, i) => {
          const isPicked = picked.has(i);
          let cls = 'opt-btn' + (isPicked ? ' picked' : '');
          let boxTxt = isPicked ? '✓' : '';
          if (st.attempted) {
            if (o.correct) { cls = 'opt-btn selected-correct'; boxTxt = '✓'; }
            else if (isPicked) { cls = 'opt-btn selected-wrong'; boxTxt = '✗'; }
          }
          return `<button type="button" class="${cls}" ${st.attempted ? 'disabled' : ''} data-i="${i}">
            <span class="exam-box">${boxTxt}</span>
            <span>${o.text}</span>
          </button>`;
        }).join('')}</div>`;
        if (st.attempted) return;
        body.querySelectorAll('.opt-btn').forEach((btn, i) => btn.addEventListener('click', () => {
          if (picked.has(i)) picked.delete(i);
          else if (picked.size < q.RequiredCount) picked.add(i);
          draw();
        }));
        const slot = document.getElementById('stageActionSlot');
        slot.innerHTML = `<button type="button" class="btn-grade" id="btnGradeMulti" ${picked.size !== q.RequiredCount ? 'disabled' : ''}>✓ Calificar selección (${picked.size}/${q.RequiredCount})</button>`;
        document.getElementById('btnGradeMulti').addEventListener('click', () => {
          let hits = 0;
          picked.forEach(i => { if (opts[i].correct) hits++; });
          const fullOk = hits === q.RequiredCount;
          finalizeAttempt(fullOk, hits, fullOk ? `✅ ¡Excelente! (+${hits} aciertos) ${q.okMsg}` : `❌ Obtuviste ${hits} de ${q.RequiredCount} aciertos en esta corrida.`);
        });
      }
      draw();
    }

    function renderMatch(q, st) {
      const body = document.getElementById('qBody');
      const left = q.pairs.map((p, i) => ({ id: i, text: p.left }));
      if (!q._right) q._right = shuffleArray(q.pairs.map((p, i) => ({ id: i, text: p.right })));
      if (!q._lineStatus) q._lineStatus = {};
      const right = q._right, lineStatus = q._lineStatus;
      let pickedLeftId = null;

      function draw() {
        body.innerHTML = `<div class="match-columns">
          <div class="match-col" id="mL">${left.map(x => {
            const stLine = lineStatus[x.id];
            const cls = stLine === 'ok' ? 'paired-ok' : (stLine === 'err' ? 'paired-err' : (pickedLeftId === x.id ? 'active' : ''));
            return `<button type="button" class="match-btn ${cls}" ${stLine || st.attempted ? 'disabled' : ''} data-id="${x.id}"><span>${x.text}</span><span>${stLine === 'ok' ? '✅' : (stLine === 'err' ? '❌' : '•')}</span></button>`;
          }).join('')}</div>
          <div class="match-col" id="mR">${right.map(x => {
            const stLine = lineStatus[x.id];
            const cls = stLine === 'ok' ? 'paired-ok' : (stLine === 'err' ? 'paired-err' : '');
            return `<button type="button" class="match-btn ${cls}" ${stLine === 'ok' || st.attempted ? 'disabled' : ''} data-id="${x.id}"><span>•</span><span>${x.text}</span></button>`;
          }).join('')}</div>
        </div>`;
        if (st.attempted) return;
        body.querySelectorAll('#mL .match-btn').forEach(b => b.addEventListener('click', () => {
          pickedLeftId = Number(b.dataset.id);
          draw();
        }));
        body.querySelectorAll('#mR .match-btn').forEach(r => r.addEventListener('click', () => {
          if (pickedLeftId === null) return;
          const rId = Number(r.dataset.id);
          if (rId === pickedLeftId) { lineStatus[pickedLeftId] = 'ok'; playSfx('ok'); }
          else { lineStatus[pickedLeftId] = 'err'; playSfx('err'); }
          pickedLeftId = null;
          if (Object.keys(lineStatus).length === q.pairs.length) {
            const okCount = Object.values(lineStatus).filter(v => v === 'ok').length;
            const scalePts = Math.round((okCount / q.pairs.length) * q.pts);
            finalizeAttempt(okCount === q.pairs.length, scalePts, okCount === q.pairs.length
              ? `✅ ¡Relacionaste correctamente las ${q.pairs.length} líneas! (+${scalePts} aciertos)`
              : `❌ Acertaste ${okCount} de ${q.pairs.length} líneas (+${scalePts} aciertos).`);
          } else {
            draw();
          }
        }));
      }
      draw();
    }

    function renderTraffic(q, st) {
      const body = document.getElementById('qBody');
      if (!q._picks) q._picks = q.rows.map(() => null);
      const picks = q._picks;

      function draw() {
        body.innerHTML = `<div class="traffic-table">${q.rows.map((r, i) => {
          const cur = picks[i];
          return `<div class="traffic-row">
            <div style="flex:1;min-width:200px;">${r.text}</div>
            <div class="traffic-btns">
              ${['verde', 'amarillo', 'rojo'].map(col => {
                const label = col === 'verde' ? '🟢 Verde' : (col === 'amarillo' ? '🟡 Amarillo' : '🔴 Rojo');
                const cls = cur === col ? `sel-${col}` : '';
                return `<button type="button" class="t-pill ${cls}" ${st.attempted ? 'disabled' : ''} data-r="${i}" data-c="${col}">${label}</button>`;
              }).join('')}
            </div>
          </div>`;
        }).join('')}</div>`;
        if (st.attempted) return;
        body.querySelectorAll('.t-pill').forEach(btn => btn.addEventListener('click', () => {
          picks[Number(btn.dataset.r)] = btn.dataset.c;
          draw();
        }));
        const ready = picks.every(x => x !== null);
        document.getElementById('stageActionSlot').innerHTML = `<button type="button" class="btn-grade" id="btnGradeTraffic" ${!ready ? 'disabled' : ''}>✓ Calificar Semáforo (3 aciertos · 1 intento)</button>`;
        document.getElementById('btnGradeTraffic').addEventListener('click', () => {
          let hits = 0;
          q.rows.forEach((r, i) => { if (picks[i] === r.correct) hits++; });
          const fullOk = hits === q.rows.length;
          finalizeAttempt(fullOk, hits, fullOk ? `✅ ¡3 de 3 aciertos! ${q.okMsg}` : `❌ Obtuviste ${hits} de 3 aciertos en el Semáforo.`);
        });
      }
      draw();
    }

    function renderWordFill(q, st) {
      const body = document.getElementById('qBody');
      if (!q._shuffledChoices) q._shuffledChoices = shuffleArray(q.choices);
      function draw() {
        const cur = q._pickedWord || '________';
        body.innerHTML = `
          <div class="exam-line-box">${q.beforeText} <span class="line-slot">${cur}</span> ${q.afterText}</div>
          <div class="word-bank">${q._shuffledChoices.map(w => `
            <button type="button" class="word-chip ${q._pickedWord === w ? 'active' : ''}" ${st.attempted ? 'disabled' : ''} data-w="${w}">${w}</button>
          `).join('')}</div>
        `;
        if (st.attempted) return;
        body.querySelectorAll('.word-chip').forEach(btn => btn.addEventListener('click', () => {
          q._pickedWord = btn.dataset.w;
          draw();
        }));
        document.getElementById('stageActionSlot').innerHTML = `<button type="button" class="btn-grade" id="btnGradeWord" ${!q._pickedWord ? 'disabled' : ''}>✓ Calificar respuesta (1 intento)</button>`;
        document.getElementById('btnGradeWord').addEventListener('click', () => {
          const ok = q._pickedWord === q.answer;
          finalizeAttempt(ok, ok ? q.pts : 0, ok ? `✅ ¡Correcto! ${q.okMsg}` : `❌ Incorrecto. La respuesta correcta era: «${q.answer}».`);
        });
      }
      draw();
    }

    function renderCommaGaps(q, st) {
      const body = document.getElementById('qBody');
      if (!q._gaps) q._gaps = new Set();
      const activeGaps = q._gaps;
      function draw() {
        let html = '<div class="token-box">';
        q.segments.forEach((seg, i) => {
          html += `<span>${seg}</span>`;
          if (i < q.segments.length - 1) {
            const on = activeGaps.has(i);
            html += `<button type="button" class="comma-slot ${on ? 'active' : ''}" ${st.attempted ? 'disabled' : ''} data-g="${i}">${on ? ',' : '+'}</button>`;
          }
        });
        html += '</div>';
        body.innerHTML = html;
        if (st.attempted) return;
        body.querySelectorAll('.comma-slot').forEach(btn => btn.addEventListener('click', () => {
          const g = Number(btn.dataset.g);
          if (activeGaps.has(g)) activeGaps.delete(g); else activeGaps.add(g);
          draw();
        }));
        document.getElementById('stageActionSlot').innerHTML = `<button type="button" class="btn-grade" id="btnCheckCommas">✓ Calificar comas (1 intento)</button>`;
        document.getElementById('btnCheckCommas').addEventListener('click', () => {
          const ok = q.segments.slice(0, -1).every((_, i) => q.commaAfter.includes(i) === activeGaps.has(i));
          finalizeAttempt(ok, ok ? q.pts : 0, ok ? `✅ ¡Muy bien! ${q.okMsg}` : `❌ Incorrecto en esta corrida. ${q.okMsg}`);
        });
      }
      draw();
    }

    function renderRedCaps(q, st) {
      const body = document.getElementById('qBody');
      if (!q._marked) q._marked = new Set();
      const marked = q._marked;
      function draw() {
        body.innerHTML = `<div class="token-box">${q.tokens.map((tk, i) => {
          const on = marked.has(i);
          const label = on ? `<span class="red-cap">${tk.text[0].toUpperCase()}</span>${tk.text.slice(1)}` : tk.text;
          return `<button type="button" class="word-token ${on ? 'marked-red' : ''}" ${st.attempted ? 'disabled' : ''} data-i="${i}">${label}</button>`;
        }).join('')}</div>`;
        if (st.attempted) return;
        body.querySelectorAll('.word-token').forEach(btn => btn.addEventListener('click', () => {
          const i = Number(btn.dataset.i);
          if (marked.has(i)) marked.delete(i); else marked.add(i);
          draw();
        }));
        document.getElementById('stageActionSlot').innerHTML = `<button type="button" class="btn-grade" id="btnCheckCaps">✓ Calificar mayúsculas (1 intento)</button>`;
        document.getElementById('btnCheckCaps').addEventListener('click', () => {
          const ok = q.tokens.every((tk, i) => Boolean(tk.needsCap) === marked.has(i));
          finalizeAttempt(ok, ok ? q.pts : 0, ok ? `✅ ¡Perfecto! ${q.okMsg}` : `❌ Incorrecto en esta corrida. ${q.okMsg}`);
        });
      }
      draw();
    }

    function renderMathM7(q, st) {
      const body = document.getElementById('qBody');
      if (!q._chipState) q._chipState = {};
      if (!q._grid) {
        q._grid = {
          carryC: '', carryD: '',
          r1C: '', r1D: '', r1U: '',
          sign: '',
          r2C: '', r2D: '', r2U: '',
          resC: '', resD: '', resU: ''
        };
        q._activeCell = 'r1C';
      }
      const cs = q._chipState, g = q._grid;
      const cellOrder = ['r1C', 'r1D', 'r1U', 'sign', 'r2C', 'r2D', 'r2U', 'resU', 'resD', 'resC'];

      function cellHtml(key, placeholder, extraCls = '') {
        const val = g[key];
        const isAct = !st.attempted && q._activeCell === key;
        return `<td class="cdu-cell ${extraCls} ${isAct ? 'active-target' : ''} ${val !== '' ? 'filled' : ''}" data-k="${key}">${val !== '' ? val : `<span style="color:#94a3b8;font-size:0.8rem;">${placeholder}</span>`}</td>`;
      }

      function draw() {
        body.innerHTML = `
          <div class="m7-step-box">
            <div class="m7-step-title"><span>Paso 1 (1 acierto): Toca los datos para marcar ✅ Útil o tachar 🚫 Distractor</span></div>
            <div class="m7-chips-row">
              ${q.chips.map(ch => {
                const mode = cs[ch.id] || '';
                const ico = mode === 'useful' ? '✅ ' : (mode === 'trampa' ? '🚫 ' : '⚪ ');
                return `<button type="button" class="m7-data-chip ${mode}" ${st.attempted ? 'disabled' : ''} data-cid="${ch.id}">${ico}${ch.label}</button>`;
              }).join('')}
            </div>
          </div>

          <div class="m7-step-box" style="margin-bottom:0;">
            <div class="m7-step-title"><span>Paso 2 y 3 (2 aciertos): Acomoda las cantidades, el signo (${q.op}) y el resultado en la cuadrícula C-D-U</span></div>
            <div class="workbench-wrap">
              <table class="cdu-grid">
                <tr>
                  <th>Signo</th><th class="th-c">C</th><th class="th-d">D</th><th class="th-u">U</th>
                </tr>
                <tr>
                  <td style="text-align:center;font-size:0.72rem;font-weight:800;color:#64748b;">Llevada/Canje</td>
                  ${cellHtml('carryC', 'c', 'carry-cell')}
                  ${cellHtml('carryD', 'd', 'carry-cell')}
                  <td></td>
                </tr>
                <tr>
                  <td style="text-align:center;font-size:0.75rem;font-weight:800;color:#334155;">Fila 1</td>
                  ${cellHtml('r1C', 'C')}
                  ${cellHtml('r1D', 'D')}
                  ${cellHtml('r1U', 'U')}
                </tr>
                <tr>
                  ${cellHtml('sign', '+/−', 'sign-cell')}
                  ${cellHtml('r2C', 'C')}
                  ${cellHtml('r2D', 'D')}
                  ${cellHtml('r2U', 'U')}
                </tr>
                <tr>
                  <td style="text-align:center;font-size:0.75rem;font-weight:900;color:#065f46;">Total</td>
                  ${cellHtml('resC', 'C', 'result-cell')}
                  ${cellHtml('resD', 'D', 'result-cell')}
                  ${cellHtml('resU', 'U', 'result-cell')}
                </tr>
              </table>

              <div>
                <div style="font-size:0.82rem;font-weight:800;color:#475569;margin-bottom:0.35rem;">Toca cualquier casilla de la cuadrícula y usa el teclado:</div>
                <div class="digit-palette">
                  ${[1,2,3,4,5,6,7,8,9,0].map(n => `<button type="button" class="digit-btn" ${st.attempted ? 'disabled' : ''} data-digit="${n}">${n}</button>`).join('')}
                  <button type="button" class="digit-btn sign-plus" ${st.attempted ? 'disabled' : ''} data-sign="+">+</button>
                  <button type="button" class="digit-btn sign-minus" ${st.attempted ? 'disabled' : ''} data-sign="−">−</button>
                  <button type="button" class="digit-btn clear-btn" ${st.attempted ? 'disabled' : ''} id="btnClearCell">⌫ Casilla</button>
                </div>
              </div>
            </div>
          </div>
        `;
        if (st.attempted) return;

        body.querySelectorAll('.m7-data-chip').forEach(btn => btn.addEventListener('click', () => {
          const cid = btn.dataset.cid;
          const cur = cs[cid] || '';
          cs[cid] = cur === '' ? 'useful' : (cur === 'useful' ? 'trampa' : '');
          draw();
        }));

        body.querySelectorAll('.cdu-cell').forEach(cell => cell.addEventListener('click', () => {
          q._activeCell = cell.dataset.k;
          draw();
        }));

        body.querySelectorAll('.digit-btn[data-digit]').forEach(btn => btn.addEventListener('click', () => {
          if (q._activeCell === 'sign') q._activeCell = 'r2C';
          g[q._activeCell] = btn.dataset.digit;
          const curIdx = cellOrder.indexOf(q._activeCell);
          if (curIdx !== -1 && curIdx + 1 < cellOrder.length) q._activeCell = cellOrder[curIdx + 1];
          draw();
        }));

        body.querySelectorAll('.digit-btn[data-sign]').forEach(btn => btn.addEventListener('click', () => {
          g.sign = btn.dataset.sign;
          q._activeCell = 'r2C';
          draw();
        }));

        document.getElementById('btnClearCell').addEventListener('click', () => {
          g[q._activeCell] = '';
          draw();
        });

        const hasResult = g.resU !== '' && g.resD !== '';
        document.getElementById('stageActionSlot').innerHTML = `<button type="button" class="btn-grade" id="btnGradeM7" ${!hasResult ? 'disabled' : ''}>✓ Calificar Problema (3 aciertos · 1 intento)</button>`;
        document.getElementById('btnGradeM7').addEventListener('click', () => {
          const trampaOk = q.chips.every(ch => ch.isTrampa ? cs[ch.id] === 'trampa' : cs[ch.id] === 'useful');
          const r1Num = parseInt((g.r1C || '0') + (g.r1D || '0') + (g.r1U || '0'), 10);
          const r2Num = parseInt((g.r2C || '0') + (g.r2D || '0') + (g.r2U || '0'), 10);
          const signOk = g.sign === q.op;
          const rowsOk = q.op === '+'
            ? ((r1Num === q.row1 && r2Num === q.row2) || (r1Num === q.row2 && r2Num === q.row1)) && g.r1U !== '' && g.r2U !== ''
            : (r1Num === q.row1 && r2Num === q.row2 && g.r1U !== '' && g.r2U !== '');
          const acomodoOk = signOk && rowsOk;
          const resNum = parseInt((g.resC || '0') + (g.resD || '0') + (g.resU || '0'), 10);
          const resOk = resNum === q.expected;

          const ptsEarned = (trampaOk ? 1 : 0) + (acomodoOk ? 1 : 0) + (resOk ? 1 : 0);
          const fullOk = ptsEarned === 3;
          const detail = `[Distractor: ${trampaOk ? '✅ 1/1' : '❌ 0/1'} · Acomodo C-D-U y signo ${q.op}: ${acomodoOk ? '✅ 1/1' : '❌ 0/1'} · Resultado (${q.expected} ${q.unitLabel}): ${resOk ? '✅ 1/1' : '❌ 0/1'}]`;
          finalizeAttempt(fullOk, ptsEarned, fullOk
            ? `✅ ¡3 de 3 aciertos! ${q.okMsg} ${detail}`
            : `❌ Obtuviste ${ptsEarned} de 3 aciertos en este problema. ${detail}`);
        });
      }
      draw();
    }

    function renderSummary() {
      const totalPts = getTotalMax(), earnedPts = getTotalEarned();
      const pct = Math.round((earnedPts / totalPts) * 100);
      const saved = saveExamProgress(earnedPts, totalPts);
      const campoStats = {};
      deck.forEach((q, i) => {
        if (!campoStats[q.campo]) campoStats[q.campo] = { ok: 0, total: 0 };
        campoStats[q.campo].total += answersState[i].maxPts;
        campoStats[q.campo].ok += answersState[i].earnedPts;
      });
      playSfx('win');
      document.getElementById('stageContainer').innerHTML = `
        <h2 class="stage-prompt">🏆 Boleta del Simulador Sumativo · Proyecto 3</h2>
        <p style="font-size:1.05rem; color:#334155; margin-bottom:0.85rem;">Obtuviste <strong>${earnedPts} de ${totalPts} aciertos</strong> en esta corrida (<strong>${pct}%</strong>). Mejor calificación guardada: <strong>${saved.bestPct}%</strong>.</p>
        <div class="campos-grid">
          ${Object.entries(campoStats).map(([campo, s]) => `<div class="campo-box"><h4>${campo}</h4><p style="font-weight:900; font-size:1.15rem; color:${s.ok === s.total ? '#059669' : '#d97706'}; margin-top:0.25rem;">${s.ok} / ${s.total} aciertos</p></div>`).join('')}
        </div>
        <div class="stage-footer">
          <button type="button" class="btn-primary" onclick="startExam()">🔄 Iniciar Nueva Corrida desde 0 (Nuevos números)</button>
          <a class="btn-nav" href="../../index.html" style="background:#334155;">⬅ Volver al Portal</a>
        </div>
      `;
    }

    initUiClickSfx();
    checkUnlockAndStart();
  </script>

    }
  </script>
