<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="45%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#f59e0b" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Fondo squircle redondeado moderno -->
  <rect x="18" y="18" width="476" height="476" rx="118" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="16"/>

  <!-- Brillo sutil de cristal en la mitad superior -->
  <path d="M 32 134 C 32 78 78 32 134 32 L 378 32 C 434 32 480 78 480 134 L 480 185 C 360 230 152 230 32 185 Z" fill="#ffffff" opacity="0.10"/>

  <!-- Estrella dorada brillante arriba del mando -->
  <g filter="url(#starGlow)">
    <path d="M 256 86 L 266 114 L 296 114 L 272 132 L 281 160 L 256 142 L 231 160 L 240 132 L 216 114 L 246 114 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Mando de videojuegos ergonómico y estilizado -->
  <g filter="url(#dropShadow)">
    <!-- Silueta principal del control -->
    <path d="M 148 186 C 120 186 78 240 78 330 C 78 382 112 412 148 412 C 182 412 204 364 230 326 C 242 308 270 308 282 326 C 308 364 330 412 364 412 C 400 412 434 382 434 330 C 434 240 392 186 364 186 C 330 186 298 202 256 202 C 214 202 182 186 148 186 Z" fill="#ffffff"/>

    <!-- Cruz Direccional D-Pad en empuñadura izquierda -->
    <rect x="122" y="280" width="66" height="22" rx="5" fill="#1e293b"/>
    <rect x="144" y="258" width="22" height="66" rx="5" fill="#1e293b"/>
    <circle cx="155" cy="291" r="4.5" fill="#334155"/>

    <!-- Botones de Acción arcade de 4 colores en empuñadura derecha -->
    <!-- Superior (Verde) -->
    <circle cx="357" cy="261" r="11" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
    <!-- Derecho (Rojo) -->
    <circle cx="387" cy="291" r="11" fill="#ef4444" stroke="#dc2626" stroke-width="1.5"/>
    <!-- Inferior (Amarillo) -->
    <circle cx="357" cy="321" r="11" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
    <!-- Izquierdo (Azul) -->
    <circle cx="327" cy="291" r="11" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>

    <!-- Botones centrales Select y Start -->
    <rect x="224" y="254" width="22" height="9" rx="4.5" fill="#94a3b8" transform="rotate(-18 235 258)"/>
    <rect x="266" y="248" width="22" height="9" rx="4.5" fill="#94a3b8" transform="rotate(18 277 252)"/>
  </g>
</svg>