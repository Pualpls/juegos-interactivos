<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Masa y Longitud · 3° "A"</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-panel: #ffffff;
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --emerald: #16a34a;
      --amber: #d97706;
      --rose: #e11d48;
      --purple: #7c3aed;
      --text-main: #0f172a;
      --border: #cbd5e1;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none !important;
      user-select: none !important;
      -webkit-user-select: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }

    body {
      font-family: 'Lexend', 'Fredoka', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      background: rgba(15, 23, 42, 0.95);
      color: #fff;
      padding: 0.65rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid rgba(255, 255, 255, 0.12);
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      font-size: 1.8rem;
      background: rgba(2, 132, 199, 0.2);
      border: 2px solid #38bdf8;
      border-radius: 0.75rem;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-text h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #f8fafc;
    }

    .brand-text p {
      font-size: 0.78rem;
      color: #94a3b8;
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .student-pill {
      background: #1e293b;
      border: 2px solid #38bdf8;
      color: #e0f2fe;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .student-pill:hover {
      background: #0369a1;
    }

    .score-pill {
      background: #dcfce7;
      color: #14532d;
      border: 2px solid #22c55e;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.92rem;
    }

    /* TABS */
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem 0.25rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: rgba(30, 41, 59, 0.85);
      color: #cbd5e1;
      border: 2px solid rgba(255, 255, 255, 0.15);
      padding: 0.55rem 1.1rem;
      border-radius: 0.85rem;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: #7dd3fc;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.45);
    }

    /* MAIN WORKSPACE */
    main {
      flex: 1;
      max-width: 1360px;
      width: 100%;
      margin: 0 auto;
      padding: 0.75rem 1rem 1.25rem;
      display: flex;
      flex-direction: column;
    }

    .workspace {
      background: var(--bg-panel);
      border-radius: 1.25rem;
      padding: 1.15rem 1.35rem;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
      border: 3px solid #e2e8f0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 0.5rem;
      border-bottom: 2px dashed #cbd5e1;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .panel-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #1e293b;
    }

    .badge-info {
      background: #e0f2fe;
      color: #0369a1;
      font-size: 0.82rem;
      font-weight: 800;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
    }

    /* BOTONES DE ACCION */
    .btn-action {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #fff;
      border: none;
      padding: 0.6rem 1.25rem;
      border-radius: 0.75rem;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: transform 0.15s;
    }

    .btn-action:hover {
      transform: translateY(-2px);
    }

    .feedback-bar {
      background: #f1f5f9;
      border: 2px solid #cbd5e1;
      border-radius: 0.9rem;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      font-size: 0.98rem;
      font-weight: 700;
      color: #334155;
    }

    .feedback-bar.ok {
      background: #dcfce7;
      border-color: #22c55e;
      color: #14532d;
    }

    .feedback-bar.warn {
      background: #fef3c7;
      border-color: #f59e0b;
      color: #92400e;
    }

    .feedback-bar.err {
      background: #fee2e2;
      border-color: #ef4444;
      color: #991b1b;
    }

    /* ========================================================
       ESTACION 1: REGLA GRADUADA Y ALINEACION EN EL 0
       ======================================================== */
    .ruler-container {
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 1rem;
      padding: 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
      overflow-x: auto;
    }

    .ruler-bench {
      position: relative;
      width: 820px;
      height: 190px;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 0.85rem;
      padding: 10px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    /* Riel donde se coloca el objeto sobre la regla */
    .object-placement-zone {
      position: relative;
      width: 800px;
      height: 90px;
      margin-bottom: 6px;
    }

    .draggable-object {
      position: absolute;
      top: 10px;
      height: 70px;
      cursor: grab;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }

    .draggable-object:active {
      cursor: grabbing;
    }

    .draggable-object img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.45));
    }

    .draggable-object:active {
      cursor: grabbing;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .draggable-object img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .draggable-object .start-edge-marker {
      position: absolute;
      left: 0;
      top: -18px;
      background: #ef4444;
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
    }

    .draggable-object .end-edge-marker {
      position: absolute;
      right: 0;
      bottom: -18px;
      background: #0284c7;
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
    }

    /* LA REGLA FISICA */
    .physical-ruler {
      position: relative;
      width: 800px;
      height: 60px;
      background: linear-gradient(to bottom, #fef08a 0%, #fde047 100%);
      border: 2px solid #ca8a04;
      border-radius: 6px;
      display: flex;
      align-items: flex-start;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    }

    /* Borde fisico antes del 0 (margen real de fabrica) */
    .ruler-deadzone {
      width: 40px;
      height: 100%;
      border-right: 2px solid #ca8a04;
      background: rgba(202, 138, 4, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 700;
      color: #854d0e;
      text-align: center;
      line-height: 1.1;
      padding: 2px;
    }

    /* Raya Verde de Inicio en el 0 */
    .zero-alignment-guide {
      position: absolute;
      left: 40px;
      top: -110px;
      bottom: 0;
      width: 3px;
      background: #16a34a;
      z-index: 10;
      pointer-events: none;
    }

    .zero-alignment-guide::before {
      content: '▲ RAYA DEL 0 (Inicio exacto)';
      position: absolute;
      top: 0;
      left: -80px;
      background: #16a34a;
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }

    /* Marcas graduadas en cm (cada 1 cm = 30px) */
    .ruler-scale {
      position: relative;
      width: 760px;
      height: 100%;
      display: flex;
    }

    .cm-tick {
      position: absolute;
      top: 0;
      height: 24px;
      border-left: 2px solid #713f12;
      font-size: 0.75rem;
      font-weight: 800;
      color: #713f12;
      padding-left: 3px;
      padding-top: 26px;
    }

    .cm-tick.half {
      height: 14px;
      border-left: 1.5px solid #a16207;
      padding-top: 0;
    }

    .ruler-controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 820px;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      width: 100%;
      max-width: 820px;
    }

    .btn-cm-choice {
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 0.75rem;
      padding: 0.75rem;
      font-size: 1.15rem;
      font-weight: 800;
      color: #1e293b;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }

    .btn-cm-choice:hover:not(:disabled) {
      border-color: #0284c7;
      background: #f0f9ff;
      transform: translateY(-2px);
    }

    .btn-cm-choice.correct {
      background: #dcfce7 !important;
      border-color: #22c55e !important;
      color: #14532d !important;
    }

    .btn-cm-choice.wrong {
      background: #fee2e2 !important;
      border-color: #ef4444 !important;
      color: #991b1b !important;
    }

    /* ========================================================
       ESTACION 2: BALANZA MECANICA OSCILANTE CON PESAS ANTIGUAS
       ======================================================== */
    .scale-stage-box {
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 1rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    /* Estructura visual de la Balanza */
    .scale-visual-container {
      position: relative;
      width: 100%;
      max-width: 680px;
      height: 270px;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 1rem;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 20px;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.03);
      overflow: hidden;
    }

    /* Base y Columna central de la balanza */
    .scale-base-pillar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 175px;
      background: linear-gradient(to right, #475569, #64748b, #334155);
      border-radius: 6px;
      z-index: 2;
    }

    .scale-base-pillar::after {
      content: '';
      position: absolute;
      bottom: -15px;
      left: -44px;
      width: 120px;
      height: 20px;
      background: linear-gradient(to bottom, #334155, #1e293b);
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    }

    .scale-fulcrum-pivot {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 24px;
      background: #f59e0b;
      border: 3px solid #b45309;
      border-radius: 50%;
      z-index: 5;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    /* Brazo transversal basculante */
    .scale-crossbeam {
      position: absolute;
      top: 82px;
      left: 50%;
      width: 480px;
      height: 12px;
      margin-left: -240px;
      background: linear-gradient(to bottom, #f59e0b, #d97706);
      border: 1.5px solid #92400e;
      border-radius: 6px;
      transform-origin: 50% 50%;
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 3;
    }

    /* Aguja marcadora central */
    .scale-needle {
      position: absolute;
      bottom: 10px;
      left: 50%;
      width: 4px;
      height: 48px;
      margin-left: -2px;
      background: #dc2626;
      border-radius: 2px;
      transform-origin: 50% 100%;
    }

    /* Conjuntos colgantes de platillos (izquierdo y derecho) */
    .scale-pan-assembly {
      position: absolute;
      top: 8px;
      width: 170px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .scale-pan-assembly.left {
      left: -10px;
    }

    .scale-pan-assembly.right {
      right: -10px;
    }

    .scale-chains {
      width: 140px;
      height: 75px;
      position: relative;
    }

    .scale-chains::before, .scale-chains::after {
      content: '';
      position: absolute;
      top: 0;
      width: 2px;
      height: 75px;
      background: #94a3b8;
    }
    .scale-chains::before { left: 15px; transform: rotate(18deg); }
    .scale-chains::after { right: 15px; transform: rotate(-18deg); }

    .scale-plate {
      width: 170px;
      min-height: 70px;
      background: linear-gradient(to bottom, #f1f5f9, #cbd5e1);
      border: 2px solid #94a3b8;
      border-radius: 0 0 85px 85px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px;
      position: relative;
    }

    .scale-plate.balanced {
      background: linear-gradient(to bottom, #dcfce7, #86efac);
      border-color: #22c55e;
      box-shadow: 0 0 18px rgba(34, 197, 94, 0.45);
    }

    /* Banco de Pesas Tradicionales */
    .weights-bank {
      width: 100%;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 1rem;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .weights-bank-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .weights-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(105px, 1fr));
      gap: 0.75rem;
    }

    .weight-card-btn {
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 0.75rem;
      padding: 0.6rem 0.4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .weight-card-btn:hover {
      border-color: #0284c7;
      background: #f0f9ff;
      transform: translateY(-2px);
    }

    .weight-card-btn img {
      object-fit: contain;
    }

    .weight-card-btn .w-label {
      font-size: 0.85rem;
      font-weight: 800;
      color: #0f172a;
    }

    .weight-card-btn .w-sub {
      font-size: 0.72rem;
      color: #64748b;
      font-weight: 600;
    }

    /* Pesas colocadas en el platillo derecho */
    .placed-weights-container {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      align-items: center;
      justify-content: center;
      max-width: 150px;
    }

    .placed-weight-mini {
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 2px 4px;
      font-size: 0.68rem;
      font-weight: 800;
      color: #b45309;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .placed-weight-mini:hover {
      background: #fee2e2;
      border-color: #ef4444;
      color: #ef4444;
    }

    /* ========================================================
       ESTACION 3: ¿MASA O LONGITUD? (CON IMAGENES REFERENCIALES)
       ======================================================== */
    .property-reference-banner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    @media (max-width: 700px) {
      .property-reference-banner {
        grid-template-columns: 1fr;
      }
    }

    .property-card {
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 1rem;
      padding: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    }

    .property-card img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border-radius: 10px;
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      padding: 4px;
      flex-shrink: 0;
    }

    .property-card h3 {
      font-size: 1.05rem;
      font-weight: 800;
      color: #0f172a;
    }

    .property-card p {
      font-size: 0.82rem;
      color: #64748b;
      margin-top: 2px;
      font-weight: 600;
    }

    /* ========================================================
       ESTACION 4: ¿cm, m o km? (UNIDAD OPTIMA DE LONGITUD)
       ======================================================== */
    .unit-selection-arena {
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 1rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      align-items: center;
    }

    .unit-challenge-card {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 1rem;
      padding: 1.25rem;
      max-width: 740px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    }

    .unit-challenge-badge {
      display: inline-block;
      background: #f3e8ff;
      color: #7c3aed;
      font-size: 0.82rem;
      font-weight: 800;
      padding: 0.3rem 0.85rem;
      border-radius: 999px;
      margin-bottom: 0.6rem;
    }

    .unit-challenge-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.45;
    }

    .unit-challenge-context {
      font-size: 0.95rem;
      color: #64748b;
      font-weight: 600;
      margin-top: 0.35rem;
    }

    .unit-buttons-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      max-width: 740px;
      width: 100%;
    }

    @media (max-width: 760px) {
      .unit-buttons-grid {
        grid-template-columns: 1fr;
      }
    }

    .unit-choice-btn {
      background: #ffffff;
      border: 3px solid #cbd5e1;
      border-radius: 1rem;
      padding: 1.15rem 0.85rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .unit-choice-btn:hover:not(:disabled) {
      border-color: #0284c7;
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(2, 132, 199, 0.15);
    }

    .unit-choice-btn .u-icon {
      font-size: 2.2rem;
    }

    .unit-choice-btn .u-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #0f172a;
    }

    .unit-choice-btn .u-desc {
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 600;
      line-height: 1.25;
    }

    .unit-choice-btn.correct {
      background: #dcfce7 !important;
      border-color: #22c55e !important;
      color: #14532d !important;
    }

    .unit-choice-btn.wrong {
      background: #fee2e2 !important;
      border-color: #ef4444 !important;
      color: #991b1b !important;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand">
      <div class="brand-icon">⚖️</div>
      <div class="brand-text">
        <h1>Masa y Longitud <span style="background:#22c55e; color:#fff; font-size:0.75rem; font-weight:800; padding:2px 8px; border-radius:999px; vertical-align:middle;">v4.2</span></h1>
        <p>La Regla, la Balanza y las Unidades · 3° "A"</p>
      </div>
    </div>
    <div class="top-controls">
      <div class="student-pill" onclick="nextStudent()" title="Toca para rotar turno">
        <span>Turno:</span>
        <strong id="currentStudent">Alexander</strong>
        <span>🔄</span>
      </div>
      <div class="score-pill">Aciertos: <span id="scoreVal">0</span></div>
    </div>
  </header>

  <!-- PESTAÑAS -->
  <nav class="nav-tabs">
    <button class="tab-btn active" id="tab1" onclick="setStation(1)">📏 1. Medir con Regla (Iniciar en 0)</button>
    <button class="tab-btn" id="tab2" onclick="setStation(2)">⚖️ 2. Equilibrar Balanza (g y kg)</button>
    <button class="tab-btn" id="tab3" onclick="setStation(3)">🔍 3. ¿Masa o Longitud?</button>
    <button class="tab-btn" id="tab4" onclick="setStation(4)">📐 4. ¿cm, m o km?</button>
  </nav>

  <main>
    <div class="workspace" id="stationArea"></div>
  </main>

  <script>
    window.addEventListener('contextmenu', e => e.preventDefault(), true);
    document.addEventListener('contextmenu', e => e.preventDefault(), true);

    // LISTA OFICIAL DE LOS 14 ALUMNOS ACTIVOS (CRISTAL DADA DE BAJA)
    const students = [
      "Alexander", "Brianna", "Dalary", "Daniel", "Estrella",
      "Gael", "Jarol", "Jesús", "José Manuel", "Keyla",
      "Naomi", "Yamileth", "Adriel", "Aurora"
    ];
    let studentIdx = 0;
    let score = 0;
    let currentStation = 1;

    // SONIDO WEB AUDIO API
    function playTone(freq = 540, duration = 0.14, type = 'sine') {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.14, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch(e) {}
    }

    function playSuccessChime() {
      playTone(523, 0.12);
      setTimeout(() => playTone(659, 0.14), 110);
      setTimeout(() => playTone(784, 0.22), 220);
    }

    function nextStudent() {
      studentIdx = (studentIdx + 1) % students.length;
      document.getElementById('currentStudent').textContent = students[studentIdx];
      playTone(480, 0.08);
    }

    function setStation(n) {
      currentStation = n;
      document.querySelectorAll('.tab-btn').forEach((b, i) => {
        b.classList.toggle('active', i + 1 === n);
      });
      if (n === 1) renderStation1();
      if (n === 2) renderStation2();
      if (n === 3) renderStation3();
      if (n === 4) {
        shuffleChallenges();
        s4Idx = 0;
        renderStation4();
      }
    }

    /* ========================================================
       DATOS Y LOGICA: ESTACION 1 (REGLA GRADUADA Y ALINEACION EN 0)
       ======================================================== */
    const s1Objects = [
      {
        name: "Lápiz escolar",
        img: "regla_lapiz.png",
        cm: 14,
        options: [14, 11, 16, 12],
        note: "El lápiz mide 14 cm de la punta al borrador."
      },
      {
        name: "Abatelenguas de madera",
        img: "regla_abatelenguas.png",
        cm: 15,
        options: [15, 13, 17, 10],
        note: "El abatelenguas mide 15 cm de largo."
      },
      {
        name: "Crayola azul",
        img: "regla_crayon.png",
        cm: 8,
        options: [8, 6, 10, 5],
        note: "La crayola mide 8 cm de largo."
      },
      {
        name: "Goma de borrar",
        img: "regla_goma.png",
        cm: 5,
        options: [5, 4, 7, 3],
        note: "La goma mide 5 cm de longitud."
      },
      {
        name: "Clip metálico",
        img: "regla_clip.png",
        cm: 3,
        options: [3, 2, 5, 4],
        note: "El clip mide 3 cm de longitud."
      }
    ];

    let s1Idx = 0;
    let s1ObjectOffsetPx = 0; // Posicion x del objeto
    const ZERO_POS_PX = 40;   // Pixeles exactos donde está la raya del 0
    const CM_TO_PX = 28;      // Cada 1 cm = 28 px

    function renderStation1() {
      const item = s1Objects[s1Idx];
      const objWidthPx = item.cm * CM_TO_PX;
      // Inicia desalineado (a la izquierda, en el borde de madera x=0) para obligar a colocarlo
      s1ObjectOffsetPx = 0;

      const area = document.getElementById('stationArea');
      area.innerHTML = `
        <div class="panel-header">
          <div class="panel-title">📏 Estación 1: Medición con Regla (${s1Idx + 1}/${s1Objects.length})</div>
          <span class="badge-info">Regla de 3° Primaria</span>
        </div>

        <div class="ruler-container">
          <div class="ruler-bench" id="rulerBench">
            <div class="object-placement-zone" id="placementZone">
              <div class="draggable-object" id="dragObj" style="left: ${s1ObjectOffsetPx}px; width: ${objWidthPx}px;">
                <div class="start-edge-marker">◀ Extremo Inicial</div>
                <img src="img/${item.img}" alt="${item.name}">
                <div class="end-edge-marker">Fin ▶</div>
              </div>
            </div>

            <!-- Regla Fisica -->
            <div class="physical-ruler">
              <div class="ruler-deadzone">Borde madera</div>
              <div class="zero-alignment-guide"></div>
              <div class="ruler-scale">
                ${Array.from({length: 26}, (_, i) => `
                  <div class="cm-tick" style="left: ${i * CM_TO_PX}px;">${i}</div>
                  ${i < 25 ? `<div class="cm-tick half" style="left: ${i * CM_TO_PX + CM_TO_PX/2}px;"></div>` : ''}
                `).join('')}
              </div>
            </div>
          </div>

          <div class="ruler-controls-row">
            <div style="display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap;">
              <button class="btn-action" style="background:#16a34a;" onclick="snapToZero()">🎯 Alinear al 0 cm</button>
              <button class="btn-action" style="background:#64748b;" onclick="resetObjectPos()">↺ Al borde inicial</button>
              <span id="alignmentStatus" style="font-size:0.9rem; font-weight:700; color:#b45309;">
                ⚠️ Objeto en el borde de madera. ¡Muévelo a la raya verde del 0!
              </span>
            </div>
          </div>

          <!-- Opciones de Medida -->
          <div style="width:100%; max-width:820px; margin-top:0.5rem;">
            <p style="font-weight:800; font-size:1.05rem; color:#1e293b; margin-bottom:0.6rem;">
              ¿Cuántos centímetros (cm) mide "${item.name}"?
            </p>
            <div class="options-grid" id="cmOptionsGrid">
              ${item.options.map(val => `
                <button class="btn-cm-choice" onclick="checkS1Choice(${val}, this)">${val} cm</button>
              `).join('')}
            </div>
          </div>
        </div>

        <div class="feedback-bar warn" id="s1Feedback">
          <span>Arrastra o toca "🎯 Alinear al 0 cm" para colocar el extremo izquierdo exactamente en la raya verde del 0.</span>
          <button class="btn-action" id="s1NextBtn" style="display:none;" onclick="nextS1()">Siguiente Objeto ➔</button>
        </div>
      `;

      initDragEvents();
    }

    function initDragEvents() {
      const el = document.getElementById('dragObj');
      const zone = document.getElementById('placementZone');
      if (!el || !zone) return;

      let startX = 0;
      let initialLeft = 0;
      let isDragging = false;

      function onPointerDown(e) {
        isDragging = true;
        startX = e.clientX || (e.touches && e.touches[0].clientX);
        initialLeft = s1ObjectOffsetPx;
        el.setPointerCapture && el.setPointerCapture(e.pointerId);
      }

      function onPointerMove(e) {
        if (!isDragging) return;
        const currentX = e.clientX || (e.touches && e.touches[0].clientX);
        const dx = currentX - startX;
        let newLeft = Math.max(0, Math.min(zone.clientWidth - el.clientWidth, initialLeft + dx));
        s1ObjectOffsetPx = newLeft;
        el.style.left = `${newLeft}px`;
        checkAlignment();
      }

      function onPointerUp(e) {
        isDragging = false;
        // Snap magnético si está cerca de la raya del 0 (dentro de 12px)
        if (Math.abs(s1ObjectOffsetPx - ZERO_POS_PX) < 14) {
          snapToZero();
        }
      }

      el.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
    }

    function snapToZero() {
      s1ObjectOffsetPx = ZERO_POS_PX;
      const el = document.getElementById('dragObj');
      if (el) el.style.left = `${ZERO_POS_PX}px`;
      playTone(600, 0.1);
      checkAlignment();
    }

    function resetObjectPos() {
      s1ObjectOffsetPx = 0;
      const el = document.getElementById('dragObj');
      if (el) el.style.left = `0px`;
      checkAlignment();
    }

    function checkAlignment() {
      const status = document.getElementById('alignmentStatus');
      const fb = document.getElementById('s1Feedback');
      const diff = Math.abs(s1ObjectOffsetPx - ZERO_POS_PX);

      if (diff <= 3) {
        status.innerHTML = `<span style="color:#16a34a;">✅ ¡Extremo alineado exactamente en el 0 cm!</span>`;
        fb.className = "feedback-bar ok";
        fb.querySelector('span').textContent = `¡Perfecto! El extremo izquierdo está en el 0. Ahora lee en la regla hasta qué número llega el extremo derecho.`;
      } else if (s1ObjectOffsetPx < ZERO_POS_PX) {
        status.innerHTML = `<span style="color:#dc2626;">⚠️ Estás midiendo desde el borde de madera (${ZERO_POS_PX - s1ObjectOffsetPx} px antes del 0).</span>`;
        fb.className = "feedback-bar warn";
        fb.querySelector('span').textContent = `Recuerda: la medición NO empieza en el borde de madera de la regla, sino en la raya verde del 0.`;
      } else {
        status.innerHTML = `<span style="color:#b45309;">⚠️ El objeto está adelantado después del 0. Arrástralo a la izquierda hacia la raya verde.</span>`;
        fb.className = "feedback-bar warn";
        fb.querySelector('span').textContent = `Coloca el objeto con su extremo izquierdo justo en la raya del 0.`;
      }
    }

    function checkS1Choice(selectedCm, btn) {
      const item = s1Objects[s1Idx];
      const isAligned = Math.abs(s1ObjectOffsetPx - ZERO_POS_PX) <= 6;
      const fb = document.getElementById('s1Feedback');

      if (!isAligned) {
        fb.className = "feedback-bar warn";
        fb.querySelector('span').textContent = "⚠️ Primero alinea el objeto en la raya del 0 cm antes de responder para medir con precisión.";
        playTone(280, 0.2, 'sawtooth');
        return;
      }

      document.querySelectorAll('.btn-cm-choice').forEach(b => b.disabled = true);

      if (selectedCm === item.cm) {
        btn.classList.add('correct');
        score += 100;
        document.getElementById('scoreVal').textContent = score;
        fb.className = "feedback-bar ok";
        fb.querySelector('span').textContent = `¡Correcto! ${item.note} (+100 pts)`;
        document.getElementById('s1NextBtn').style.display = 'inline-flex';
        playSuccessChime();
      } else {
        btn.classList.add('wrong');
        fb.className = "feedback-bar err";
        fb.querySelector('span').textContent = `No coincide. Observa con calma el número exacto donde termina el extremo derecho.`;
        playTone(220, 0.25, 'sawtooth');
        setTimeout(() => {
          document.querySelectorAll('.btn-cm-choice').forEach(b => b.disabled = false);
          btn.classList.remove('wrong');
        }, 1200);
      }
    }

    function nextS1() {
      s1Idx = (s1Idx + 1) % s1Objects.length;
      renderStation1();
    }

    /* ========================================================
       DATOS Y LOGICA: ESTACION 2 (BALANZA OSCILANTE CON PESAS ANTIGUAS)
       ======================================================== */
    const s2Objects = [
      {
        name: "Bolsa de mandarinas y guayabas para el ponche",
        img: "pares_fruta.png",
        targetGrams: 1000,
        display: "1 kilogramo (1,000 g)",
        tip: "1 kilogramo equivale a 1,000 gramos. Puedes usar una pesa de 1 kg o dos pesas de 500 g."
      },
      {
        name: "Piñata tradicional de cartón y periódico",
        img: "juguete_pinata.png",
        targetGrams: 750,
        display: "750 gramos",
        tip: "750 gramos se logran sumando una pesa de 500 g y una pesa de 250 g."
      },
      {
        name: "Paquete de colaciones y dulces para aguinaldos",
        img: "posada_aguinaldo.png",
        targetGrams: 500,
        display: "Medio kilogramo (500 g)",
        tip: "Medio kilogramo son 500 gramos exactos."
      },
      {
        name: "Avioncito de madera y juguetes del taller",
        img: "juguete_avioncito.png",
        targetGrams: 250,
        display: "Un cuarto de kilo (250 g)",
        tip: "250 gramos es la cuarta parte de un kilogramo."
      },
      {
        name: "Ponche artesanal de granada de Sayula",
        img: "posada_ponche.png",
        targetGrams: 1000,
        display: "1 kilogramo (1,000 g)",
        tip: "1 kilogramo (1,000 g) es la masa tradicional de una botella de ponche de Sayula."
      }
    ];

    // Pesas tradicionales de latón (con imágenes IA)
    const weightCatalog = [
      { id: "w1000", grams: 1000, label: "1 kg", sub: "1,000 g", img: "pesa_1kg.png", w: 46 },
      { id: "w500",  grams: 500,  label: "500 g", sub: "1/2 kg",  img: "pesa_500g.png", w: 40 },
      { id: "w250",  grams: 250,  label: "250 g", sub: "1/4 kg",  img: "pesa_250g.png", w: 34 },
      { id: "w100",  grams: 100,  label: "100 g", sub: "Latón",   img: "pesa_100g.png", w: 28 },
      { id: "w50",   grams: 50,   label: "50 g",  sub: "Mini",    img: "pesa_50g.png",  w: 24 }
    ];

    let s2Idx = 0;
    let placedWeights = []; // Arreglo de pesas colocadas en el platillo derecho

    function renderStation2() {
      const obj = s2Objects[s2Idx];
      const area = document.getElementById('stationArea');
      placedWeights = [];

      area.innerHTML = `
        <div class="panel-header">
          <div class="panel-title">⚖️ Estación 2: Equilibrar la Balanza (${s2Idx + 1}/${s2Objects.length})</div>
          <span class="badge-info">1 kg = 1,000 g</span>
        </div>

        <div class="scale-stage-box">
          <!-- Balanza Visual -->
          <div class="scale-visual-container">
            <!-- Base fija -->
            <div class="scale-base-pillar">
              <div class="scale-fulcrum-pivot"></div>
            </div>

            <!-- Brazo móvil -->
            <div class="scale-crossbeam" id="scaleBeam">
              <div class="scale-needle" id="scaleNeedle"></div>

              <!-- Platillo Izquierdo (Objeto a pesar) -->
              <div class="scale-pan-assembly left" id="leftAssembly">
                <div class="scale-chains"></div>
                <div class="scale-plate" id="leftPlate">
                  <img src="img/${obj.img}" alt="" style="width:58px;height:58px;object-fit:contain;background:#fff;border-radius:8px;padding:3px;border:1px solid #cbd5e1;">
                  <span style="font-size:0.75rem;font-weight:800;color:#0f172a;margin-top:2px;text-align:center;">${obj.name.split(' ')[0]}</span>
                  <span style="font-size:0.7rem;font-weight:900;color:#0284c7;">Masa: ${obj.display}</span>
                </div>
              </div>

              <!-- Platillo Derecho (Pesas de latón) -->
              <div class="scale-pan-assembly right" id="rightAssembly">
                <div class="scale-chains"></div>
                <div class="scale-plate" id="rightPlate">
                  <div class="placed-weights-container" id="placedWeightsBox">
                    <span style="font-size:0.75rem;color:#64748b;font-weight:700;">(Platillo vacío)</span>
                  </div>
                  <span style="font-size:0.72rem;font-weight:900;color:#b45309;margin-top:4px;" id="rightGramsLabel">
                    Pesas: 0 g
                  </span>
                </div>
              </div>
            </div>
          </div>

          <!-- Banco de Pesas Tradicionales -->
          <div class="weights-bank">
            <div class="weights-bank-title">
              <span>🪙 Banco de Pesas Tradicionales de Latón (Toca para colocar en el platillo)</span>
              <button class="btn-action" style="padding:0.35rem 0.75rem;font-size:0.8rem;background:#ef4444;" onclick="clearWeights()">Vaciar platillo</button>
            </div>
            <div class="weights-grid">
              ${weightCatalog.map(w => `
                <button class="weight-card-btn" onclick="addWeight(${w.grams}, '${w.label}', '${w.img}')">
                  <img src="img/${w.img}" alt="${w.label}" style="width:${w.w + 12}px;height:${w.w + 12}px;">
                  <span class="w-label">${w.label}</span>
                  <span class="w-sub">${w.sub}</span>
                </button>
              `).join('')}
            </div>
          </div>
        </div>

        <div class="feedback-bar warn" id="s2Feedback">
          <span>El platillo izquierdo pesa más (${obj.targetGrams} g) y la balanza está inclinada a la izquierda. Agrega pesas de latón al platillo derecho.</span>
          <button class="btn-action" id="s2NextBtn" style="display:none;" onclick="nextS2()">Siguiente Pesaje ➔</button>
        </div>
      `;

      updateScalePhysics();
    }

    function addWeight(grams, label, img) {
      placedWeights.push({ grams, label, img });
      playTone(440 + grams/5, 0.09);
      updateScalePhysics();
    }

    function removeWeight(idx) {
      placedWeights.splice(idx, 1);
      playTone(320, 0.08);
      updateScalePhysics();
    }

    function clearWeights() {
      placedWeights = [];
      playTone(260, 0.1);
      updateScalePhysics();
    }

    function updateScalePhysics() {
      const target = s2Objects[s2Idx].targetGrams;
      const currentRight = placedWeights.reduce((acc, w) => acc + w.grams, 0);
      const diff = target - currentRight; // Si diff > 0, izquierda es más pesada

      // Renderizar miniaturas de pesas en platillo derecho
      const box = document.getElementById('placedWeightsBox');
      const label = document.getElementById('rightGramsLabel');
      if (box && label) {
        if (placedWeights.length === 0) {
          box.innerHTML = `<span style="font-size:0.75rem;color:#64748b;font-weight:700;">(Platillo vacío)</span>`;
        } else {
          box.innerHTML = placedWeights.map((w, idx) => `
            <div class="placed-weight-mini" onclick="removeWeight(${idx})" title="Toca para quitar" style="display:flex; align-items:center; gap:4px; padding:2px 6px; background:#fff; border:1.5px solid #cbd5e1; border-radius:6px; cursor:pointer;">
              <img src="img/${w.img}" alt="${w.label}" style="height:26px; width:auto; object-fit:contain;">
              <span style="font-size:0.75rem; font-weight:800; color:#0f172a;">${w.label}</span>
              <span style="font-size:0.6rem; color:#ef4444; font-weight:900;">✕</span>
            </div>
          `).join('');
        }
        label.textContent = `Pesas: ${currentRight} g ${currentRight >= 1000 ? '(' + (currentRight/1000) + ' kg)' : ''}`;
      }

      // Calcular ángulo de inclinación (-16° a +16°)
      // Si diff > 0 (pesa más izq), el brazo izquierdo baja -> rotación antihoraria (negativa)
      const maxAngle = 16;
      let angle = 0;
      if (diff !== 0) {
        angle = Math.max(-maxAngle, Math.min(maxAngle, (diff / 800) * maxAngle));
      }

      const beam = document.getElementById('scaleBeam');
      const leftAssembly = document.getElementById('leftAssembly');
      const rightAssembly = document.getElementById('rightAssembly');
      const leftPlate = document.getElementById('leftPlate');
      const rightPlate = document.getElementById('rightPlate');
      const needle = document.getElementById('scaleNeedle');

      if (beam && leftAssembly && rightAssembly) {
        // El brazo rota
        beam.style.transform = `rotate(${-angle}deg)`;
        // Los platillos contrarrotan para permanecer siempre horizontales
        leftAssembly.style.transform = `rotate(${angle}deg)`;
        rightAssembly.style.transform = `rotate(${angle}deg)`;
        needle.style.transform = `rotate(${angle * 0.8}deg)`;
      }

      const fb = document.getElementById('s2Feedback');
      const nextBtn = document.getElementById('s2NextBtn');

      if (diff === 0) {
        // EQUILIBRIO PERFECTO
        if (leftPlate) leftPlate.classList.add('balanced');
        if (rightPlate) rightPlate.classList.add('balanced');
        fb.className = "feedback-bar ok";
        fb.querySelector('span').textContent = `✨ ¡Balanza en perfecto equilibrio! Has igualado exactamente la masa: ${target} g. ${s2Objects[s2Idx].tip} (+100 pts)`;
        if (nextBtn) nextBtn.style.display = 'inline-flex';
        score += 100;
        document.getElementById('scoreVal').textContent = score;
        playSuccessChime();
      } else {
        if (leftPlate) leftPlate.classList.remove('balanced');
        if (rightPlate) rightPlate.classList.remove('balanced');
        if (nextBtn) nextBtn.style.display = 'none';

        if (diff > 0) {
          fb.className = "feedback-bar warn";
          fb.querySelector('span').textContent = `La balanza está inclinada a la izquierda. Faltan ${diff} g para equilibrar el objeto.`;
        } else {
          fb.className = "feedback-bar err";
          fb.querySelector('span').textContent = `¡Te pasaste de peso! El platillo derecho pesa ${-diff} g más que el objeto. Toca una pesa para quitarla.`;
        }
      }
    }

    function nextS2() {
      s2Idx = (s2Idx + 1) % s2Objects.length;
      renderStation2();
    }

    /* ========================================================
       DATOS Y LOGICA: ESTACION 3 (¿MASA O LONGITUD?)
       ======================================================== */
    const s3Questions = [
      {
        q: "Al inflar los globos para la piñata, queremos saber cuánto mide su contorno alrededor para que todos los conos queden simétricos.",
        prop: "Longitud",
        unit: "Centímetros (cm) · Regla o cinta",
        img: "material_globo.png",
        opts: [
          "Propiedad: Longitud · Instrumento: Cinta métrica (cm)",
          "Propiedad: Masa · Instrumento: Balanza (kg)",
          "Propiedad: Capacidad · Instrumento: Vaso medidor",
          "Propiedad: Masa · Instrumento: Regla (g)"
        ],
        ans: "Propiedad: Longitud · Instrumento: Cinta métrica (cm)",
        exp: "El contorno o tamaño de un objeto es una longitud y se mide en centímetros (cm)."
      },
      {
        q: "La comisión compró 2 kilogramos de cañas, 1 kilogramo de tejocotes y 500 gramos de guayabas en el mercado local.",
        prop: "Masa",
        unit: "Kilogramos (kg) y gramos (g) · Balanza",
        img: "pares_fruta.png",
        opts: [
          "Propiedad: Masa · Instrumento: Balanza (g y kg)",
          "Propiedad: Longitud · Instrumento: Metro (m)",
          "Propiedad: Longitud · Instrumento: Balanza (cm)",
          "Propiedad: Tiempo · Instrumento: Reloj"
        ],
        ans: "Propiedad: Masa · Instrumento: Balanza (g y kg)",
        exp: "La cantidad de materia o peso de los alimentos es masa y se mide con balanza en gramos y kilogramos."
      },
      {
        q: "Para armar el avioncito de juguete, necesitamos marcar con un lápiz el centro exacto de un abatelenguas de madera.",
        prop: "Longitud",
        unit: "Centímetros (cm) · Regla escolar",
        img: "juguete_avioncito.png",
        opts: [
          "Propiedad: Longitud · Instrumento: Regla graduada (cm)",
          "Propiedad: Masa · Instrumento: Balanza de platillos (g)",
          "Propiedad: Masa · Instrumento: Metro (kg)",
          "Propiedad: Volumen · Instrumento: Báscula"
        ],
        ans: "Propiedad: Longitud · Instrumento: Regla graduada (cm)",
        exp: "Para objetos pequeños del aula usamos la regla graduada en centímetros (cm), iniciando siempre desde el 0."
      },
      {
        q: "Queremos comprobar por qué la piñata pesa más cuando tiene el engrudo húmedo que cuando ya se secó al sol en el patio.",
        prop: "Masa",
        unit: "Gramos (g) · Balanza",
        img: "material_engrudo.png",
        opts: [
          "Propiedad: Masa · Instrumento: Balanza (g)",
          "Propiedad: Longitud · Instrumento: Regla (cm)",
          "Propiedad: Longitud · Instrumento: Balanza (m)",
          "Propiedad: Temperatura · Instrumento: Termómetro"
        ],
        ans: "Propiedad: Masa · Instrumento: Balanza (g)",
        exp: "El peso o pesadez del engrudo húmedo frente al seco corresponde a la masa."
      }
    ];

    let s3Idx = 0;

    function renderStation3() {
      const item = s3Questions[s3Idx];
      const area = document.getElementById('stationArea');

      area.innerHTML = `
        <div class="panel-header">
          <div class="panel-title">🔍 Estación 3: ¿Masa o Longitud? (${s3Idx + 1}/${s3Questions.length})</div>
          <span class="badge-info">Conceptos Clave de 3°</span>
        </div>

        <!-- Banners Referenciales de Cada Propiedad -->
        <div class="property-reference-banner">
          <div class="property-card" style="border-color:#38bdf8;">
            <img src="img/instrumento_balanza.png" alt="Balanza">
            <div>
              <h3>⚖️ MASA (Peso)</h3>
              <p>Mide cuánta materia tiene un cuerpo. Unidades: <strong>gramos (g)</strong> y <strong>kilogramos (kg)</strong> con balanza.</p>
            </div>
          </div>
          <div class="property-card" style="border-color:#34d399;">
            <img src="img/instrumento_regla.png" alt="Regla">

              <h3>📏 LONGITUD</h3>
              <p>Mide dimensiones, alturas y distancias. Unidades: <strong>centímetros (cm)</strong>, <strong>metros (m)</strong> y <strong>kilómetros (km)</strong> con regla o metro.</p>
            </div>
          </div>
        </div>

        <div style="background:#fff; border:2px solid #cbd5e1; border-radius:1rem; padding:1.25rem; display:flex; align-items:center; gap:1.25rem; flex-wrap:wrap;">
          <img src="img/${item.img}" alt="" style="width:110px;height:110px;object-fit:contain;border-radius:12px;border:2px solid #cbd5e1;background:#f8fafc;padding:6px;flex-shrink:0;">
          <div style="flex:1; min-width:260px;">

          </div>
        </div>

        <div style="margin-top:0.75rem;">
          <p style="font-weight:800; font-size:1rem; color:#334155; margin-bottom:0.6rem;">

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem;" id="s3OptsGrid">

              <button class="btn-cm-choice" style="font-size:0.95rem;text-align:left;padding:0.9rem;" onclick="checkS3Choice('${opt}', this)">

        <div class="feedback-bar" id="s3Feedback" style="margin-top:0.75rem;">
          <span>Lee la situación y decide si se trata de pesar (masa) o de medir tamaño (longitud).</span>
          <button class="btn-action" id="s3NextBtn" style="display:none;" onclick="nextS3()">Siguiente Pregunta ➔</button>
        </div>
      `;
    }

    function checkS3Choice(selected, btn) {
      const item = s3Questions[s3Idx];
      const fb = document.getElementById('s3Feedback');
      document.querySelectorAll('#s3OptsGrid button').forEach(b => b.disabled = true);

      if (selected === item.ans) {
        btn.classList.add('correct');
        score += 100;
        document.getElementById('scoreVal').textContent = score;
        fb.className = "feedback-bar ok";
        fb.querySelector('span').textContent = `¡Excelente! ${item.exp} (+100 pts)`;
        document.getElementById('s3NextBtn').style.display = 'inline-flex';
        playSuccessChime();
      } else {
        btn.classList.add('wrong');
        fb.className = "feedback-bar err";
        fb.querySelector('span').textContent = `Respuesta inexacta. Recuerda: longitud mide tamaños (cm, m); masa mide peso (g, kg).`;
        playTone(220, 0.25, 'sawtooth');
        setTimeout(() => {
          document.querySelectorAll('#s3OptsGrid button').forEach(b => b.disabled = false);
          btn.classList.remove('wrong');
        }, 1200);
      }
    }

    function nextS3() {
      s3Idx = (s3Idx + 1) % s3Questions.length;
      renderStation3();
    }

    /* ========================================================
       DATOS Y LOGICA: ESTACION 4 (¿cm, m o km? UNIDAD OPTIMA)
       ======================================================== */
    let s4Challenges = [
      {
        target: "El largo de un lápiz",
        context: "Útil escolar de estuche",
        unit: "cm",
        exp: "Los lápices miden entre 10 y 18 centímetros (cm); la regla es el instrumento ideal."
      },
      {
        target: "El ancho del pizarrón",
        context: "Mobiliario escolar del aula",
        unit: "m",
        exp: "Un pizarrón mide entre 2 y 3 metros (m); usar una regla de 30 cm sería impráctico."
      },
      {
        target: "La distancia en carretera de Sayula a Guadalajara",
        context: "Trayecto entre ciudades",
        unit: "km",
        exp: "Las distancias entre ciudades y carreteras se miden en kilómetros (km); son más de 100 km."
      },
      {
        target: "El grosor de una moneda",
        context: "Objeto pequeño de bolsillo",
        unit: "cm",
        exp: "Una moneda mide unos cuantos milímetros o menos de medio centímetro (cm)."
      },
      {
        target: "La altura de la puerta del salón",
        context: "Elemento del aula",
        unit: "m",
        exp: "Las puertas escolares miden aproximadamente 2 metros (m) de altura."
      },
      {
        target: "El largo de la cancha escolar",
        context: "Espacio para educación física",
        unit: "m",
        exp: "Las canchas deportivas miden entre 20 y 28 metros (m) de largo."
      },
      {
        target: "El largo de un abatelenguas",
        context: "Material para manualidades",
        unit: "cm",
        exp: "Un abatelenguas mide exactamente 15 centímetros (cm)."
      },
      {
        target: "La distancia de viaje a la playa",
        context: "Viaje por autopista",
        unit: "km",
        exp: "Para grandes distancias geográficas y viajes por carretera usamos kilómetros (km)."
      },
      {
        target: "La estatura de un alumno o alumna",
        context: "Medición de crecimiento",
        unit: "m",
        exp: "En 3° grado la estatura promedio se expresa en metros y centímetros (ejemplo: 1.25 m)."
      },
      {
        target: "El largo de una goma de borrar",
        context: "Útil escolar pequeño",
        unit: "cm",
        exp: "Las gomas de borrar miden entre 4 y 6 centímetros (cm)."
      }
    ];

    function shuffleChallenges() {
      for (let i = s4Challenges.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [s4Challenges[i], s4Challenges[j]] = [s4Challenges[j], s4Challenges[i]];
      }
    }

    let s4Idx = 0;

    function renderStation4() {
      const item = s4Challenges[s4Idx];
      const area = document.getElementById('stationArea');

      area.innerHTML = `
        <div class="panel-header">
          <div class="panel-title">📐 Estación 4: ¿Cuál es la unidad más adecuada? (${s4Idx + 1}/${s4Challenges.length})</div>
          <span class="badge-info">cm · m · km</span>
        </div>

        <div class="unit-selection-arena">
          <div class="unit-challenge-card">
            <span class="unit-challenge-badge">${item.context}</span>
            <h2 class="unit-challenge-title">¿Cuál unidad es la más óptima para medir:</h2>
            <div style="font-size:1.35rem; font-weight:900; color:#0284c7; margin-top:0.4rem;">
              "${item.target}"?
            </div>
            <p class="unit-challenge-context">Elige la unidad más práctica de las tres opciones siguientes:</p>
          </div>

          <!-- Las 3 Opciones Obligatorias: cm, m o km con Ilustraciones IA -->
          <div class="unit-buttons-grid" id="unitGrid">

              <img src="img/unit_cm.png" alt="Centímetros" style="width:78px; height:78px; object-fit:contain; border-radius:12px; border:2px solid #cbd5e1; background:#fff; padding:4px;">
              <span class="u-title">Centímetros (cm)</span>
              <span class="u-desc">Para objetos pequeños del aula usando la regla escolar.</span>
            </button>

            <button class="unit-choice-btn" onclick="checkUnitChoice('m', this)">
              <img src="img/unit_m.png" alt="Metros" style="width:78px; height:78px; object-fit:contain; border-radius:12px; border:2px solid #cbd5e1; background:#fff; padding:4px;">
              <span class="u-title">Metros (m)</span>
              <span class="u-desc">Para cosas grandes, personas y salones usando metro o flexómetro.</span>
            </button>

            <button class="unit-choice-btn" onclick="checkUnitChoice('km', this)">
              <img src="img/unit_km.png" alt="Kilómetros" style="width:78px; height:78px; object-fit:contain; border-radius:12px; border:2px solid #cbd5e1; background:#fff; padding:4px;">
              <span class="u-title">Kilómetros (km)</span>
              <span class="u-desc">Para distancias grandes entre pueblos, ciudades y carreteras.</span>
            </button>
          </div>
        </div>

        <div class="feedback-bar" id="s4Feedback">
          <span>Reflexiona: ¿es algo pequeño (cm), un espacio o cosa grande (m), o una distancia carretera (km)?</span>
          <button class="btn-action" id="s4NextBtn" style="display:none;" onclick="nextS4()">Siguiente Reto ➔</button>
        </div>
      `;
    }

    function checkUnitChoice(selectedUnit, btn) {
      const item = s4Challenges[s4Idx];
      const fb = document.getElementById('s4Feedback');
      document.querySelectorAll('#unitGrid button').forEach(b => b.disabled = true);

      if (selectedUnit === item.unit) {
        btn.classList.add('correct');
        score += 100;
        document.getElementById('scoreVal').textContent = score;
        fb.className = "feedback-bar ok";
        fb.querySelector('span').textContent = `¡Correcto! ${item.exp} (+100 pts)`;
        document.getElementById('s4NextBtn').style.display = 'inline-flex';
        playSuccessChime();
      } else {
        btn.classList.add('wrong');
        fb.className = "feedback-bar err";
        fb.querySelector('span').textContent = `Opción no óptima. Reflexiona sobre la escala: ${item.exp}`;

        setTimeout(() => {
          document.querySelectorAll('#unitGrid button').forEach(b => b.disabled = false);
          btn.classList.remove('wrong');

    function nextS4() {
      s4Idx = (s4Idx + 1) % s4Challenges.length;

    }

    // Inicializar en la Estación 1
    renderStation1();
