<!DOCTYPE html>
<html lang="es">

<head>
  <!-- Favicon e iconos de aplicacion -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Posadas y Tradiciones · 3° "A"</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-panel: #ffffff;
      --primary: #7c3aed;
      --primary-dark: #6d28d9;
      --emerald: #16a34a;
      --amber: #d97706;
      --rose: #e11d48;
      --text-main: #0f172a;
      --border: #cbd5e1;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none !important;
      user-select: none !important;
      -webkit-user-select: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }

    body {
      font-family: 'Lexend', 'Fredoka', 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      background: rgba(15, 23, 42, 0.95);
      color: #fff;
      padding: 0.65rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid rgba(255, 255, 255, 0.12);
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      font-size: 1.9rem;
      background: rgba(124, 58, 237, 0.25);
      border: 2px solid #a78bfa;
      border-radius: 0.75rem;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-text h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #f8fafc;
    }

    .brand-text p {
      font-size: 0.78rem;
      color: #94a3b8;
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .student-pill {
      background: #1e293b;
      border: 2px solid #c084fc;
      color: #f3e8ff;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .score-pill {
      background: #fef3c7;
      color: #92400e;
      border: 2px solid #f59e0b;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.92rem;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 0.65rem;
      padding: 0.75rem 1rem 0.25rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: rgba(30, 41, 59, 0.85);
      color: #cbd5e1;
      border: 2px solid rgba(255, 255, 255, 0.15);
      padding: 0.55rem 1.2rem;
      border-radius: 0.85rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: #d8b4fe;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.45);
    }

    main {
      flex: 1;
      max-width: 1360px;
      width: 100%;
      margin: 0 auto;
      padding: 0.75rem 1rem 1.25rem;
      display: flex;
      flex-direction: column;
    }

    .workspace {
      background: var(--bg-panel);
      border-radius: 1.25rem;
      padding: 1rem 1.25rem;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
      border: 3px solid #e2e8f0;
      flex: 1;
      display: grid;
      grid-template-columns: 180px 1.2fr 1.35fr;
      gap: 1rem;
      align-items: stretch;
    }

    @media (max-width: 960px) {
      .workspace {
        grid-template-columns: 1fr;
        overflow-y: auto;
      }
    }

    .posada-col-img {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 1rem;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      text-align: center;
    }

    .posada-col-img img {
      width: 148px;
      height: 148px;
      object-fit: contain;
      border-radius: 12px;
      background: #ffffff;
      padding: 6px;
      border: 2px solid #cbd5e1;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
    }

    .posada-col-story {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 1rem;
      padding: 0.95rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .posada-col-choices {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 1rem;
      padding: 0.95rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .panel-box {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 1rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px dashed #cbd5e1;
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #1e293b;
    }

    .badge-info {
      background: #f3e8ff;
      color: #6d28d9;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 0.22rem 0.65rem;
      border-radius: 999px;
    }

    .story-box {
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 0.9rem;
      padding: 1.1rem;
      font-size: 1.06rem;
      line-height: 1.6;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 0.75rem;
    }

    .red-cap {
      color: #dc2626;
      font-weight: 900;
    }

    .choice-list {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .choice-btn {
      background: #ffffff;
      border: 2px solid #94a3b8;
      border-left: 6px solid var(--primary);
      border-radius: 0.85rem;
      padding: 0.8rem 0.95rem;
      font-size: 0.96rem;
      font-weight: 700;
      color: #1e293b;
      text-align: left;
      cursor: pointer;
      transition: all 0.18s;
    }

    .choice-btn:hover {
      background: #faf5ff;
      border-color: var(--primary);
      transform: translateX(4px);
    }

    .choice-btn.correct {
      background: #dcfce7;
      border-color: #16a34a;
      color: #14532d;
    }

    .choice-btn.wrong {
      background: #ffe4e6;
      border-color: #e11d48;
      color: #881337;
    }

    .feedback-bar {
      margin-top: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: 0.8rem;
      font-weight: 700;
      font-size: 0.94rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background: #f3e8ff;
      color: #4c1d95;
      border: 2px solid #d8b4fe;
    }

    .feedback-bar.ok {
      background: #dcfce7;
      color: #14532d;
      border-color: #4ade80;
    }

    .feedback-bar.err {
      background: #ffe4e6;
      color: #881337;
      border-color: #fda4af;
    }

    .btn-action {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 0.55rem 1.15rem;
      border-radius: 0.65rem;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <div class="brand-icon">🪅</div>
      <div class="brand-text">
        <h1>Posadas y Tradiciones <span
            style="background:#22c55e; color:#fff; font-size:0.75rem; font-weight:800; padding:2px 8px; border-radius:999px; vertical-align:middle;">v4.2</span>
        </h1>
        <p>Tradición, Lenguaje y Convivencia · 3° "A"</p>
      </div>
    </div>
    <div class="top-controls">
      <div class="student-pill" onclick="nextStudent()">
        <span>👧👦 Turno:</span>
        <span id="currentStudent">Naomi</span>
        <span>🔄</span>
      </div>
      <div class="score-pill">Aciertos: <span id="scoreVal">0</span></div>
    </div>
  </header>

  <nav class="nav-tabs">
    <button class="tab-btn active" id="tab1" onclick="setTab(1)">📝 1. Descripción Cronológica de Procesos</button>
    <button class="tab-btn" id="tab2" onclick="setTab(2)">🔴 2. Comas y Mayúsculas en Rojo</button>
    <button class="tab-btn" id="tab3" onclick="setTab(3)">🤝 3. Colaboración, Ayuda Mutua e Inclusión</button>
  </nav>

  <main>
    <div class="workspace" id="boardArea"></div>
  </main>

  <script>
    window.addEventListener('contextmenu', e => e.preventDefault(), true);
    document.addEventListener('contextmenu', e => e.preventDefault(), true);

    const students = [
      "Naomi", "Brianna", "Dalary", "Estrella", "Yamileth",
      "Keyla", "Aurora", "Jarol", "Daniel",
      "José Manuel", "Alexander", "Jesús", "Adriel", "Gael"
    ];
    let studentIdx = 0;
    let score = 0;

    function playTone(freq = 540, duration = 0.14, type = 'sine') {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) { }
    }

    function nextStudent() {
      studentIdx = (studentIdx + 1) % students.length;
      document.getElementById('currentStudent').textContent = students[studentIdx];
      playTone(620, 0.08);
    }

    function addScore(pts) {
      score += pts;
      document.getElementById('scoreVal').textContent = score;
    }

    const tab1Data = [
      {
        title: "Proceso de transformación del papel y el engrudo",
        img: "lectura2_pinata.png",
        prompt: "Al describir en orden cronológico cómo elaboramos la piñata del salón, ¿qué ocurrió después de pegar las capas húmedas de periódico y dejarlas dos días al sol?",
        options: [
          "El cascarón duplicó su masa en kilogramos porque el sol hizo más pesado el periódico seco.",
          "El agua del engrudo se evaporó y el papel periódico formó un cascarón ligero, seco y resistente.",
          "Las capas de periódico quedaron húmedas y flexibles para poder doblarlas como papiroflexia.",
          "Primero vestimos el globo con papel de China y después aplicamos las capas de engrudo."
        ],
        answer: 1,
        explain: "Al secarse el agua del engrudo, las fibras de papel quedan unidas formando una estructura rígida y más ligera."
      },
      {
        title: "Descripción cronológica de la posada en la comunidad",
        img: "lectura3_posada.png",
        prompt: "Elige la oración que describe en orden cronológico cómo se organiza una posada tradicional entre las familias y vecinos:",
        options: [
          "Primero parten la piñata y reparten los aguinaldos, después acuerdan las comisiones entre vecinos y finalmente compran la fruta.",
          "Primero sirven el ponche caliente a los invitados, antes van al mercado a comprar la fruta y finalmente adornan el patio.",
          "Primero los vecinos acuerdan las comisiones, después adornan el patio y preparan el ponche, y finalmente conviven y parten la piñata.",
          "Finalmente reúnen a los vecinos para repartir las comisiones, después parten la piñata y primero limpian el patio."
        ],
        answer: 2,
        explain: "Una descripción cronológica respeta el orden real de los hechos usando conectores como primero, después y finalmente."
      },
      {
        title: "Proceso de armado del avioncito reciclado",
        img: "juguete_avioncito.png",
        prompt: "¿Cuál de las siguientes descripciones explica en el orden cronológico correcto cómo se construyó el avioncito en el aula?",
        options: [
          "Primero medimos con la regla la mitad de los abatelenguas, después los pegamos de forma simétrica sobre el broche de madera y finalmente colocamos la cola.",
          "Primero pegamos los abatelenguas al tanteo sobre el broche, después medimos la mitad con la regla y finalmente despegamos las alas.",
          "Primero probamos el vuelo del avioncito en el patio, después le pusimos pegamento a las alas y finalmente medimos la madera.",
          "Finalmente medimos el centro de los abatelenguas con la regla, primero pintamos el avión seco y después pegamos las alas."
        ],
        answer: 0,
        explain: "Describe cada etapa en el orden exacto en que se realizó en el taller."
      }
    ];
    let t1Idx = 0;

    const tab2Data = [
      {
        title: "Uso de la coma en enumeraciones (Ponche artesanal de Sayula)",
        img: "posada_ponche.png",
        prompt: "¿Cuál de las siguientes oraciones utiliza correctamente las comas para enumerar los ingredientes del ponche tradicional de Sayula y las mayúsculas en rojo?",
        options: [
          "el ponche tradicional de sayula lleva granada roja y nuez y tamarindo y azúcar y canela.",
          "<span class='red-cap'>E</span>l ponche, de <span class='red-cap'>S</span>ayula, lleva granada nuez tamarindo y azúcar",
          "<span class='red-cap'>E</span>l ponche artesanal de <span class='red-cap'>S</span>ayula lleva granada roja, nuez, tamarindo, azúcar y canela.",
          "El ponche artesanal lleva, granada, y, nuez, y tamarindo."
        ],
        answer: 2,
        explain: "Inicia con mayúscula en rojo, escribe 'Sayula' con mayúscula por ser nombre propio, separa la lista de elementos con comas y coloca el nexo 'y' antes del último elemento sin coma previa."
      },
      {
        title: "Mayúsculas en nombres propios y al inicio de oración",
        img: "juguete_pinata.png",
        prompt: "Identifica la oración descriptiva que tiene correctamente marcadas las mayúsculas en rojo y el punto final:",
        options: [
          "durante diciembre, las familias de sayula elaboran piñatas coloridas para convivir en armonía",
          "<span class='red-cap'>D</span>urante <span class='red-cap'>D</span>iciembre, las <span class='red-cap'>F</span>amilias de sayula elaboran <span class='red-cap'>P</span>iñatas.",
          "Durante diciembre las familias de Sayula elaboran piñatas coloridas",
          "<span class='red-cap'>D</span>urante diciembre, las familias de <span class='red-cap'>S</span>ayula elaboran piñatas coloridas para convivir en armonía."
        ],
        answer: 3,
        explain: "Se escribe mayúscula inicial en la primera palabra de la oración ('Durante') y en el nombre propio del municipio ('Sayula'), cerrando con punto."
      },
      {
        title: "Comas en la lista de materiales del taller",
        img: "material_engrudo.png",
        prompt: "Selecciona el texto donde se emplea correctamente la coma para enumerar los materiales de nuestro equipo:",
        options: [
          "<span class='red-cap'>N</span>uestro equipo utilizó papel periódico, engrudo, cartoncillo, tijeras, regla y papel de <span class='red-cap'>C</span>hina.",
          "nuestro equipo utilizó papel periódico y engrudo y cartoncillo y tijeras y regla.",
          "<span class='red-cap'>N</span>uestro equipo utilizó papel periódico engrudo cartoncillo tijeras regla.",
          "Nuestro, equipo, utilizó, papel, periódico, y, engrudo."
        ],
        answer: 0,
        explain: "Las comas separan cada material de la enumeración dando orden y claridad al texto."
      }
    ];
    let t2Idx = 0;

    const tab3Data = [
      {
        title: "Trabajo equitativo y ayuda mutua en el taller de piñatas",
        img: "lectura2_pinata.png",
        prompt: "En el equipo 2, dos compañeros quieren pegar todas las tiras de periódico ellos solos y no dejan participar a los demás. ¿Qué acuerdo comunitario resuelve la situación con justicia?",
        options: [
          "Dejar que cada quien avance a su propio ritmo sin coordinar el orden de los materiales ni revisar el producto común.",
          "Repartir roles equitativos (medir tiras, aplicar engrudo, pegar capas y cuidar el orden) rotando los turnos para que todas y todos participen.",
          "Permitir que solo los equipos que terminen primero decidan cómo deben trabajar los demás salones.",
          "Repartir los materiales únicamente al inicio y no volver a dialogar hasta que la piñata esté completamente seca."
        ],
        answer: 1,
        explain: "La colaboración y la reciprocidad consisten en distribuir las tareas con equidad y apoyarnos mutuamente."
      },
      {
        title: "Inclusión y trato digno (3 de Diciembre)",
        img: "posada_aguinaldo.png",
        prompt: "Al organizar el juego de lanzamiento de avioncitos y la quiebra de la piñata, ¿cómo garantizamos la inclusión de todas las niñas y los niños del grupo?",
        options: [
          "Establecer turnos por orden de lista sin considerar apoyos visuales ni adecuaciones de distancia para quienes lo necesitan.",
          "Realizar los juegos premiando únicamente la velocidad individual sin verificar la seguridad de la fila.",
          "Organizar la actividad permitiendo que solo quienes trajeron materiales participen en las dinámicas del patio.",
          "Acordar reglas claras, respetar el turno y el espacio de cada compañero, y adaptar la distancia o brindar apoyo para que nadie quede excluido."
        ],
        answer: 3,
        explain: "La inclusión elimina barreras para que todas las personas participen con seguridad, respeto e igualdad."
      },
      {
        title: "Reciprocidad y cuidado del aula tras el taller",
        img: "pares_bandera.png",
        prompt: "Al terminar de decorar las piñatas con papel de China, quedaron recortes de papel y gotas de engrudo en las mesas. ¿Qué acción demuestra responsabilidad comunitaria?",
        options: [
          "Colaborar entre todos los integrantes del grupo para recolectar los recortes reutilizables, limpiar las mesas y dejar el salón ordenado.",
          "Guardar los materiales personales de inmediato y dejar que la comisión de aseo general recoja todo el material sobrante.",
          "Colocar todos los recortes revueltos en una sola bolsa sin separar el papel limpio reutilizable.",
          "Limpiar únicamente la banca propia y considerar terminado el trabajo sin revisar el área compartida del equipo."
        ],
        answer: 0,
        explain: "El cuidado mutuo del espacio escolar es responsabilidad compartida de toda la comunidad del aula."
      }
    ];
    let t3Idx = 0;

    function setTab(t) {
      document.querySelectorAll('.tab-btn').forEach((b, i) => {
        b.classList.toggle('active', i + 1 === t);
      });
      if (t === 1) renderBoard(tab1Data, t1Idx, 1);
      if (t === 2) renderBoard(tab2Data, t2Idx, 2);
      if (t === 3) renderBoard(tab3Data, t3Idx, 3);
    }

    function renderBoard(dataArr, idx, tabNum) {
      const item = dataArr[idx];
      if (!item.shuffled) {
        const indices = item.options.map((_, i) => i);
        for (let i = indices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [indices[i], indices[j]] = [indices[j], indices[i]];
        }
        item.shuffled = indices.map(origIdx => ({
          text: item.options[origIdx],
          origIdx: origIdx
        }));
      }
      const area = document.getElementById('boardArea');
      area.innerHTML = `
        <!-- COLUMNA 1: IMAGEN DE LA SITUACIÓN -->
        <div class="posada-col-img">
          <span class="badge-info" style="font-size:0.75rem;">Caso ${idx + 1}/${dataArr.length}</span>
          <img src="img/${item.img}" alt="${item.title}">
          <span style="font-size:0.75rem; font-weight:700; color:#64748b; line-height:1.3;">${item.title.split('(')[0]}</span>
        </div>

        <!-- COLUMNA 2: SITUACIÓN NARRATIVA Y RETROALIMENTACIÓN -->
        <div class="posada-col-story">
          <div>
            <div class="panel-header" style="margin-bottom:0.5rem; padding-bottom:0.4rem;">
              <div class="panel-title" style="font-size:1.02rem;">📌 ${item.title}</div>
              <span class="badge-info">Tablero ${tabNum}</span>
            </div>
            <div class="story-box" style="font-size:1.05rem; line-height:1.55; margin-bottom:0.5rem; padding:0.9rem;">
              ${item.prompt}
            </div>
          </div>
          <div class="feedback-bar" id="boardFeedback" style="margin-top:0.4rem; padding:0.6rem 0.85rem;">
            <span style="font-size:0.88rem;">Lee con atención las cuatro opciones de la derecha y toca la correcta.</span>
            <button class="btn-action" style="padding:0.45rem 0.9rem; font-size:0.85rem;" onclick="nextCard(${tabNum})">Siguiente Caso ➔</button>
          </div>
        </div>

        <!-- COLUMNA 3: OPCIONES DE RESPUESTA -->
        <div class="posada-col-choices">
          <div>
            <div class="panel-header" style="margin-bottom:0.5rem; padding-bottom:0.4rem;">
              <div class="panel-title" style="font-size:1.02rem;">🎯 Opciones de Respuesta</div>
              <span class="badge-info">Toca una opción</span>
            </div>
            <div class="choice-list" style="gap:0.5rem;">
              ${item.shuffled.map(optObj => `
                <button class="choice-btn" style="padding:0.65rem 0.85rem; font-size:0.92rem;" onclick="checkChoice(this, ${optObj.origIdx}, ${tabNum})">${optObj.text}</button>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function checkChoice(btn, chosenIdx, tabNum) {
      const dataArr = tabNum === 1 ? tab1Data : (tabNum === 2 ? tab2Data : tab3Data);
      const idx = tabNum === 1 ? t1Idx : (tabNum === 2 ? t2Idx : t3Idx);
      const item = dataArr[idx];
      const fb = document.getElementById('boardFeedback');

      if (chosenIdx === item.answer) {
        btn.classList.add('correct');
        fb.className = "feedback-bar ok";
        fb.querySelector('span').textContent = "¡Excelente! " + item.explain;
        addScore(10);
        playTone(720, 0.16);
        nextStudent();
      } else {
        btn.classList.add('wrong');
        fb.className = "feedback-bar err";
        fb.querySelector('span').textContent = "Analiza nuevamente el orden de los hechos, el uso de las comas o el acuerdo de convivencia.";
        playTone(230, 0.2, 'sawtooth');
      }
    }

    function nextCard(tabNum) {
      if (tabNum === 1) { 
        tab1Data[t1Idx].shuffled = null;
        t1Idx = (t1Idx + 1) % tab1Data.length; 
        renderBoard(tab1Data, t1Idx, 1); 
      }
      if (tabNum === 2) { 
        tab2Data[t2Idx].shuffled = null;
        t2Idx = (t2Idx + 1) % tab2Data.length; 
        renderBoard(tab2Data, t2Idx, 2); 
      }
      if (tabNum === 3) { 
        tab3Data[t3Idx].shuffled = null;
        t3Idx = (t3Idx + 1) % tab3Data.length; 
        renderBoard(tab3Data, t3Idx, 3); 
      }
    }

    setTab(1);
  </script>
</body>

</html>
