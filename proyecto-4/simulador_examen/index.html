<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simulador del Examen Final · Proyecto 4</title>
  <style>
    :root { --ink:#0f172a; --muted:#475569; --primary:#6d28d9; --ok:#059669; --err:#dc2626; }
    * { box-sizing:border-box; margin:0; padding:0; user-select:none !important; -webkit-user-select:none !important; -webkit-touch-callout:none !important; -webkit-tap-highlight-color:transparent !important; }
    body { font-family:'Comic Neue','Fredoka','Lexend','Comic Sans MS','Segoe UI',sans-serif; background:linear-gradient(160deg,#0f172a 0%,#3b0764 100%); color:#f8fafc; min-height:100vh; padding:0.75rem 1rem; overflow-x:hidden; }
    .app-wrap { max-width:1180px; margin:0 auto; display:flex; flex-direction:column; gap:0.65rem; }
    .topbar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:0.6rem; background:rgba(15,23,42,0.85); border:1px solid rgba(192,132,252,0.3); border-radius:16px; padding:0.6rem 0.95rem; }
    .topbar-left, .topbar-right { display:flex; align-items:center; gap:0.55rem; flex-wrap:wrap; }
    .btn-nav { background:#334155; color:#fff; border:1.5px solid rgba(255,255,255,0.2); border-radius:12px; padding:0.45rem 0.9rem; font-family:inherit; font-size:0.9rem; font-weight:800; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:0.35rem; min-height:40px; }
    .btn-nav:hover { background:#475569; }
    .badge-sim { background:#f3e8ff; color:#5b21b6; font-weight:900; font-size:0.86rem; padding:0.35rem 0.75rem; border-radius:999px; }
    .pill-progress { background:#1e293b; border:1.5px solid #c084fc; color:#f3e8ff; padding:0.35rem 0.8rem; border-radius:999px; font-weight:800; font-size:0.88rem; }
    .btn-sound { background:rgba(16,185,129,0.2); border:1.5px solid rgba(16,185,129,0.5); color:#a7f3d0; border-radius:12px; padding:0.4rem 0.8rem; font-family:inherit; font-weight:800; cursor:pointer; min-height:40px; }
    .btn-sound.muted { background:#334155; border-color:#64748b; color:#cbd5e1; }

    /* BARRA DE NAVEGACIÓN DE REACTIVOS 1..16 */
    .q-strip { display:flex; flex-wrap:wrap; gap:0.35rem; background:rgba(15,23,42,0.72); border:1px solid rgba(255,255,255,0.12); border-radius:14px; padding:0.45rem 0.65rem; align-items:center; justify-content:center; }
    .q-dot { width:34px; height:34px; border-radius:10px; border:2px solid #475569; background:#1e293b; color:#cbd5e1; font-family:inherit; font-weight:900; font-size:0.85rem; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; transition:all 0.15s; }
    .q-dot.current { border-color:#f59e0b; background:#fef3c7; color:#92400e; transform:scale(1.08); }
    .q-dot.done-ok { border-color:#10b981; background:#065f46; color:#ecfdf5; }
    .q-dot.done-err { border-color:#f59e0b; background:#78350f; color:#fef3c7; }

    .stage-card { background:#ffffff; color:var(--ink); border-radius:20px; padding:1.1rem 1.25rem; box-shadow:0 14px 34px rgba(0,0,0,0.32); }
    .stage-meta { display:flex; align-items:center; justify-content:space-between; gap:0.6rem; margin-bottom:0.65rem; flex-wrap:wrap; border-bottom:2px dashed #e2e8f0; padding-bottom:0.5rem; }
    .campo-tag { background:#f3e8ff; color:#6d28d9; padding:0.25rem 0.75rem; border-radius:999px; font-size:0.82rem; font-weight:900; }

    /* LAYOUT VISUAL 2 COLUMNAS: ESCENA A LA IZQUIERDA, INTERACCIÓN A LA DERECHA */
    .q-split { display:grid; grid-template-columns:340px 1fr; gap:1.1rem; align-items:center; }
    @media (max-width:860px) { .q-split { grid-template-columns:1fr; } }

    .visual-panel { background:linear-gradient(145deg,#f8fafc 0%,#f3e8ff 100%); border:2.5px solid #ddd6fe; border-radius:18px; padding:0.9rem; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.55rem; text-align:center; min-height:230px; }
    .visual-panel img.hero-img { width:145px; height:145px; object-fit:contain; border-radius:14px; background:#fff; padding:6px; border:2px solid #cbd5e1; box-shadow:0 4px 10px rgba(0,0,0,0.06); }
    .visual-row-imgs { display:flex; gap:0.45rem; justify-content:center; flex-wrap:wrap; }
    .visual-row-imgs img { width:76px; height:76px; object-fit:contain; border-radius:12px; background:#fff; padding:4px; border:2px solid #cbd5e1; }
    .visual-caption { font-size:0.88rem; font-weight:800; color:#4c1d95; background:#fff; padding:0.35rem 0.7rem; border-radius:10px; border:1.5px solid #c4b5fd; width:100%; }

    /* WIDGETS VISUALES MATEMÁTICOS Y DE MEDICIÓN */
    .cdu-card { background:#fff; border:2.5px solid #475569; border-radius:14px; padding:0.65rem 1rem; display:inline-block; box-shadow:0 4px 10px rgba(0,0,0,0.06); }
    .cdu-grid { border-collapse:collapse; font-size:1.3rem; font-weight:900; margin:0 auto; }
    .cdu-grid td { width:38px; height:34px; text-align:center; border:1.5px solid #cbd5e1; }
    .cdu-grid .h-c { background:#fef3c7; color:#b45309; }
    .cdu-grid .h-d { background:#fee2e2; color:#dc2626; }
    .cdu-grid .h-u { background:#dbeafe; color:#1d4ed8; }
    .cdu-grid .op-row td { border-bottom:3px solid #0f172a; }
    .chip-board { display:flex; flex-direction:column; gap:0.4rem; width:100%; background:#fff; padding:0.65rem; border-radius:12px; border:2px solid #cbd5e1; }
    .chip-row { display:flex; align-items:center; justify-content:space-between; font-weight:800; font-size:0.88rem; padding:0.25rem 0.5rem; border-radius:8px; }
    .dot-chip { display:inline-block; width:18px; height:18px; border-radius:50%; margin-right:3px; vertical-align:middle; border:1.5px solid rgba(0,0,0,0.25); }

    .stage-prompt { font-size:1.22rem; font-weight:900; color:#0f172a; margin-bottom:0.75rem; line-height:1.3; }
    .options-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:0.65rem; }
    @media (max-width:560px) { .options-grid { grid-template-columns:1fr; } }
    .opt-btn { background:#f8fafc; border:2.5px solid #cbd5e1; border-radius:14px; padding:0.75rem 0.9rem; font-family:inherit; font-size:1.05rem; font-weight:800; color:#0f172a; text-align:left; cursor:pointer; min-height:58px; display:flex; align-items:center; gap:0.6rem; transition:all 0.15s; }
    .opt-btn:hover { border-color:#7c3aed; background:#faf5ff; transform:translateY(-2px); }
    .opt-btn .opt-ico { font-size:1.45rem; flex-shrink:0; }
    .opt-btn.selected-correct { border-color:#059669; background:#d1fae5; color:#065f46; }
    .opt-btn.selected-wrong { border-color:#dc2626; background:#fee2e2; color:#991b1b; }

    /* MATCH COMPACTO Y VISUAL */
    .match-columns { display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; }
    .match-col { display:flex; flex-direction:column; gap:0.55rem; }
    .match-btn { background:#f8fafc; border:2.5px solid #94a3b8; border-radius:12px; padding:0.65rem 0.8rem; font-family:inherit; font-size:0.95rem; font-weight:800; color:#0f172a; text-align:left; cursor:pointer; min-height:50px; display:flex; align-items:center; gap:0.45rem; }
    .match-btn.active { border-color:#7c3aed; background:#f3e8ff; box-shadow:0 0 0 3px rgba(124,58,237,0.2); }
    .match-btn.paired { border-color:#059669; background:#d1fae5; color:#065f46; }
    .match-btn.wrong-flash { border-color:#dc2626; background:#fee2e2; }

    /* ORDENAR TARJETAS VISUALES */
    .order-wrap { display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; align-items:start; }
    .order-pool, .order-slots { display:flex; flex-direction:column; gap:0.45rem; background:#f8fafc; border:2px solid #cbd5e1; border-radius:14px; padding:0.65rem; }
    .seq-card { background:#fff; border:2.5px solid #7c3aed; border-radius:11px; padding:0.55rem 0.75rem; font-weight:800; cursor:pointer; text-align:left; font-family:inherit; font-size:0.92rem; color:#0f172a; min-height:44px; }
    .seq-card.used { opacity:0.35; cursor:default; }
    .seq-slot { background:#faf5ff; border:2px dashed #a855f7; border-radius:11px; padding:0.55rem 0.75rem; font-weight:800; color:#5b21b6; min-height:44px; cursor:pointer; display:flex; align-items:center; gap:0.45rem; text-align:left; font-family:inherit; font-size:0.92rem; }

    /* TOKENS INTERACTIVOS: COMAS Y MAYÚSCULAS EN ROJO */
    .token-box { background:#f8fafc; border:2.5px solid #cbd5e1; border-radius:16px; padding:1rem; display:flex; flex-wrap:wrap; gap:0.45rem; align-items:center; font-size:1.2rem; font-weight:800; }
    .word-token { background:#fff; border:2.5px solid #94a3b8; border-radius:10px; padding:0.45rem 0.75rem; font-family:inherit; font-size:1.15rem; font-weight:800; cursor:pointer; color:#0f172a; }
    .word-token.marked-red { border-color:#dc2626; background:#fef2f2; }
    .red-cap { color:#dc2626; font-weight:900; font-size:1.25rem; text-decoration:underline; }
    .comma-slot { width:38px; height:40px; border-radius:10px; border:2.5px dashed #64748b; background:#fff; font-family:inherit; font-size:1.35rem; font-weight:900; color:#64748b; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
    .comma-slot.active { border:2.5px solid #dc2626; background:#fef2f2; color:#dc2626; }

    .feedback-box { margin-top:0.65rem; padding:0.65rem 0.9rem; border-radius:12px; font-weight:800; font-size:0.95rem; display:none; }
    .feedback-box.ok { display:block; background:#d1fae5; color:#065f46; border:2px solid #059669; }
    .feedback-box.err { display:block; background:#fee2e2; color:#991b1b; border:2px solid #dc2626; }
    .stage-footer { margin-top:0.75rem; display:flex; justify-content:space-between; align-items:center; gap:0.6rem; flex-wrap:wrap; border-top:1.5px solid #e2e8f0; padding-top:0.65rem; }
    .btn-primary { background:#6d28d9; color:#fff; border:none; border-radius:12px; padding:0.65rem 1.2rem; font-family:inherit; font-size:0.98rem; font-weight:900; cursor:pointer; min-height:44px; }
    .btn-primary:disabled { opacity:0.45; cursor:not-allowed; }
    .btn-sec { background:#e2e8f0; color:#0f172a; border:none; border-radius:12px; padding:0.6rem 1rem; font-family:inherit; font-size:0.92rem; font-weight:800; cursor:pointer; min-height:44px; }

    /* CANDADO Y RESUMEN */
    .lock-banner { background:#fffbeb; border:2.5px solid #f59e0b; border-radius:16px; padding:1rem 1.15rem; color:#78350f; margin-bottom:0.85rem; }
    .req-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:0.65rem; margin:0.85rem 0; }
    .req-card { display:flex; flex-direction:column; justify-content:space-between; gap:0.6rem; padding:0.85rem 1rem; border-radius:14px; border:2px solid #cbd5e1; background:#f8fafc; }
    .req-card.done { border-color:#059669; background:#ecfdf5; }
    .req-card.pending { border-color:#f59e0b; background:#fffbeb; }
    .req-go { background:#6d28d9; color:#fff; text-decoration:none; padding:0.5rem 0.85rem; border-radius:10px; font-weight:800; font-size:0.88rem; text-align:center; }
    .campos-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:0.65rem; margin:0.85rem 0; }
    .campo-box { background:#f8fafc; border:2px solid #cbd5e1; border-radius:14px; padding:0.8rem; }
  </style>
</head>
<body>
  <div class="app-wrap">
    <div class="topbar">
      <div class="topbar-left">
        <a class="btn-nav" href="../../index.html">⬅ Portal</a>
        <span class="badge-sim">📝 Simulador Visual del Examen · Proyecto 4</span>
      </div>
      <div class="topbar-right">
        <span class="pill-progress" id="pillProgress">Verificando...</span>
        <button type="button" class="btn-sound" id="btnSound" onclick="toggleSound()">🔊 Sonido</button>
      </div>
    </div>

    <div class="q-strip" id="qStrip" style="display:none;"></div>
    <div class="stage-card" id="stageContainer"></div>
  </div>

  <script>
    window.addEventListener('contextmenu', e => { e.preventDefault(); return false; }, { capture: true, passive: false });
    document.addEventListener('contextmenu', e => { e.preventDefault(); return false; }, { capture: true, passive: false });
    document.oncontextmenu = () => false;

    const AULA_PROGRESS_KEY = 'aula3a_pp_progress_v1';
    const PROJ_KEY = 'p4';
    const REQUIRED_PPS = [
      { id: 'taller_instructivos_juguetes', title: '📋 Taller de Juguetes (Instructivos)', href: '../taller_instructivos_juguetes/index.html' },
      { id: 'laboratorio_masa_longitud', title: '⚖️ Masa y Longitud (Regla y Balanza)', href: '../laboratorio_masa_longitud/index.html' },
      { id: 'posadas_y_tradiciones', title: '🪅 Posadas y Tradiciones (Crónica y Acuerdos)', href: '../posadas_y_tradiciones/index.html' }
    ];

    let teacherBypass = false;
    try {
      const params = new URLSearchParams(window.location.search);
      if (params.get('docente') === '1') teacherBypass = true;
    } catch (e) {}

    function readAulaProgress() {
      try {
        const parsed = JSON.parse(localStorage.getItem(AULA_PROGRESS_KEY) || '{}');
        if (!parsed || typeof parsed !== 'object') return { schemaVersion: 1, projects: {} };
        if (!parsed.projects || typeof parsed.projects !== 'object') parsed.projects = {};
        return parsed;
      } catch (e) { return { schemaVersion: 1, projects: {} }; }
    }

    function saveExamProgress(score, total) {
      const data = readAulaProgress();
      if (!data.projects[PROJ_KEY]) data.projects[PROJ_KEY] = { pps: {}, exam: null };
      const prev = data.projects[PROJ_KEY].exam || {};
      const newPct = total > 0 ? Math.round((score / total) * 100) : 0;
      const nowIso = new Date().toISOString();
      data.projects[PROJ_KEY].exam = {
        attempts: (Number(prev.attempts) || 0) + 1,
        bestPct: Math.max(Number(prev.bestPct) || 0, newPct),
        bestScore: Math.max(Number(prev.bestScore) || 0, score),
        total,
        lastPlayedAt: nowIso
      };
      try { localStorage.setItem(AULA_PROGRESS_KEY, JSON.stringify(data)); } catch (e) {}
      return data.projects[PROJ_KEY].exam;
    }

    let sharedAudioCtx = null, soundEnabled = true;
    function getAudioCtx() { const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return null; if (!sharedAudioCtx) sharedAudioCtx = new Ctx(); return sharedAudioCtx; }
    function playSfx(kind) {
      if (!soundEnabled) return; const ctx = getAudioCtx(); if (!ctx) return;
      const run = () => { try { const now = ctx.currentTime, notes = kind === 'ok' ? [[523.25,0,0.08],[659.25,0.07,0.1]] : kind === 'err' ? [[240,0,0.12],[196,0.09,0.14]] : kind === 'lock' ? [[310,0,0.09],[260,0.08,0.12]] : kind === 'win' ? [[523.25,0,0.09],[659.25,0.08,0.09],[783.99,0.16,0.16]] : [[560,0,0.05]]; notes.forEach(([f,o,d])=>{ const osc=ctx.createOscillator(),g=ctx.createGain(); osc.type=(kind==='err'||kind==='lock')?'triangle':'sine'; osc.frequency.setValueAtTime(f,now+o); g.gain.setValueAtTime(0.001,now+o); g.gain.linearRampToValueAtTime(0.08,now+o+0.01); g.gain.exponentialRampToValueAtTime(0.0008,now+o+d); osc.connect(g); g.connect(ctx.destination); osc.start(now+o); osc.stop(now+o+d+0.01); }); } catch(e){} };
      if (ctx.state === 'suspended') ctx.resume().then(run).catch(()=>{}); else run();
    }
    function initUiClickSfx() {
      if (window.__uiClickSfxBound) return; window.__uiClickSfxBound = true;
      document.addEventListener('pointerdown', (e) => { const btn = e.target && e.target.closest ? e.target.closest('button, a.btn-nav, a.req-go') : null; if (btn && !btn.disabled) playSfx('tap'); }, { capture: true, passive: true });
    }
    function toggleSound() { soundEnabled = !soundEnabled; const b = document.getElementById('btnSound'); b.textContent = soundEnabled ? '🔊 Sonido' : '🔇 Mudo'; b.classList.toggle('muted', !soundEnabled); }
    function shuffleArray(arr) { const c = arr.slice(); for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; } return c; }

    const EXAM_QUESTIONS = [
      {
        type: 'match', campo: 'Lenguajes',
        visualHtml: `<img class="hero-img" src="../taller_instructivos_juguetes/img/juguete_avioncito.png" alt="Instructivo"><div class="visual-caption">📋 Instructivo: Avioncito de madera</div>`,
        prompt: '1. Une cada parte del instructivo con su función:',
        pairs: [
          { left: '📌 Título', right: 'Nombre del juguete' },
          { left: '🧰 Materiales', right: 'Lista de lo que usamos' },
          { left: '🔢 Procedimiento', right: 'Pasos ordenados 1, 2, 3' }
        ],
        okMsg: '¡Exacto! Título, materiales y procedimiento forman el instructivo.'
      },
      {
        type: 'mcq', campo: 'Lenguajes',
        visualHtml: `<div class="visual-row-imgs"><img src="../taller_instructivos_juguetes/img/accion_doblar.png" alt="Doblar"><img src="../taller_instructivos_juguetes/img/accion_recortar.png" alt="Recortar"><img src="../taller_instructivos_juguetes/img/accion_pegar.png" alt="Pegar"></div><div class="visual-caption">Doblar · Recortar · Pegar</div>`,
        prompt: '2. ¿En qué forma están los verbos "Doblar", "Recortar" y "Pegar"?',
        options: [
          { ico: '✅', text: 'En infinitivo (-ar, -er, -ir)', correct: true },
          { ico: '📢', text: 'En imperativo (órdenes)', correct: false },
          { ico: '⏪', text: 'En tiempo pasado', correct: false },
          { ico: '🏷️', text: 'Son nombres propios', correct: false }
        ],
        okMsg: '¡Muy bien! Los verbos terminados en -ar, -er, -ir están en infinitivo.'
      },
      {
        type: 'mcq', campo: 'Lenguajes',
        visualHtml: `<img class="hero-img" src="../taller_instructivos_juguetes/img/accion_pegar.png" alt="Pegar"><div class="visual-caption">"______ los dos abatelenguas."</div>`,
        prompt: '3. Cambia el verbo "Pegar" a modo IMPERATIVO (una orden directa):',
        options: [
          { ico: '👉', text: 'Pega', correct: true },
          { ico: '📄', text: 'Pegar', correct: false },
          { ico: '⏳', text: 'Pegué', correct: false },
          { ico: '🔄', text: 'Pegando', correct: false }
        ],
        okMsg: '¡Correcto! "Pega los dos abatelenguas" es una orden en imperativo.'
      },
      {
        type: 'order', campo: 'Lenguajes',
        visualHtml: `<div class="visual-row-imgs"><img src="../taller_instructivos_juguetes/img/material_globo.png" alt="Globo"><img src="../taller_instructivos_juguetes/img/material_periodico.png" alt="Periódico"><img src="../taller_instructivos_juguetes/img/material_engrudo.png" alt="Engrudo"><img src="../taller_instructivos_juguetes/img/juguete_pinata.png" alt="Piñata"></div><div class="visual-caption">🪅 Elaboración de la piñata</div>`,
        prompt: '4. Toca en orden (del 1 al 4) los pasos para hacer la piñata:',
        steps: [
          '1. 🎈 Inflar y amarrar el globo',
          '2. 📰 Cortar periódico y hacer engrudo',
          '3. 🥣 Pegar 3 capas con engrudo',
          '4. ☀️ Dejar secar la piñata al sol'
        ],
        okMsg: '¡Excelente! Ordenaste el procedimiento del 1 al 4.'
      },
      {
        type: 'mcq', campo: 'Lenguajes',
        visualHtml: `<img class="hero-img" src="../posadas_y_tradiciones/img/lectura2_pinata.png" alt="Crónica"><div class="visual-caption">1° Primero · 2° Después · 3° Finalmente</div>`,
        prompt: '5. ¿Para qué sirven las palabras "Primero", "Después" y "Finalmente"?',
        options: [
          { ico: '⏱️', text: 'Ordenar los pasos en el tiempo', correct: true },
          { ico: '⚖️', text: 'Pesar objetos en gramos', correct: false },
          { ico: '📏', text: 'Medir con la regla escolar', correct: false },
          { ico: '🎨', text: 'Dibujar la portada', correct: false }
        ],
        okMsg: '¡Así es! Son conectores para ordenar hechos cronológicamente.'
      },
      {
        type: 'commagaps', campo: 'Lenguajes',
        visualHtml: `<img class="hero-img" src="../posadas_y_tradiciones/img/juguete_pinata.png" alt="Colores"><div class="visual-caption">🎨 Lista de colores de papel China</div>`,
        prompt: '6. Toca los 2 recuadros donde falta poner una COMA ( , ):',
        segments: ['Usamos papel rojo', 'verde', 'amarillo', 'y azul.'],
        commaAfter: [0, 1],
        okMsg: '¡Muy bien! "rojo, verde, amarillo y azul" (sin coma antes de "y").'
      },
      {
        type: 'redcaps', campo: 'Lenguajes',
        visualHtml: `<img class="hero-img" src="../posadas_y_tradiciones/img/lectura3_posada.png" alt="Nombres propios"><div class="visual-caption">✏️ Nombres propios y lugares con rojo</div>`,
        prompt: '7. Toca las 3 palabras que deben iniciar con MAYÚSCULA en rojo:',
        tokens: [
          { text: 'alexander', needsCap: true },
          { text: 'gómez', needsCap: true },
          { text: 'vive', needsCap: false },
          { text: 'en', needsCap: false },
          { text: 'sayula.', needsCap: true }
        ],
        okMsg: '¡Perfecto! Alexander Gómez y Sayula inician con mayúscula en rojo.'
      },
      {
        type: 'match', campo: 'Saberes y Pensamiento Científico',

    let deck = [], idx = 0, answersState = [];

    function unlockAsTeacher() {
      teacherBypass = true;
      startExam();
    }

    function checkUnlockAndStart() {
      const data = readAulaProgress();
      const pps = (data.projects[PROJ_KEY] && data.projects[PROJ_KEY].pps) || {};
      const missing = REQUIRED_PPS.filter(r => !(pps[r.id] && pps[r.id].completed));
      if (missing.length > 0 && !teacherBypass) {
        playSfx('lock');
        document.getElementById('qStrip').style.display = 'none';
        document.getElementById('pillProgress').textContent = `🔒 Bloqueado (${REQUIRED_PPS.length - missing.length}/${REQUIRED_PPS.length} juegos)`;
        document.getElementById('stageContainer').innerHTML = `
          <div>
            <div class="lock-banner">
              <h2 style="font-size:1.3rem;margin-bottom:0.3rem;">🔒 Completa primero tus 3 juegos del Proyecto 4</h2>
              <p style="font-size:0.95rem;">Para desbloquear el Simulador del Examen Final, logra <strong>5 aciertos</strong> en cada uno de los 3 juegos del proyecto:</p>
            </div>
            <div class="req-list">
              ${REQUIRED_PPS.map(r => {
                const st = pps[r.id];
                const isDone = Boolean(st && st.completed);
                return `
                  <div class="req-card ${isDone ? 'done' : 'pending'}">
                    <div>
                      <div style="font-weight:900; font-size:1.02rem;">${isDone ? '✅' : '⏳'} ${r.title}</div>
                      <div style="font-size:0.86rem; color:#475569; margin-top:0.2rem;">${isDone ? 'Juego acreditado' : 'Pendiente (logra 5 aciertos)'}</div>
                    </div>
                    <a class="req-go" href="${r.href}">${isDone ? 'Jugar de nuevo ➔' : 'Ir al juego ➔'}</a>
                  </div>
                `;
              }).join('')}
            </div>
            <div class="stage-footer">
              <a class="btn-nav" href="../../index.html" style="background:#1e293b;">⬅ Volver al Portal</a>
              <button type="button" class="btn-sec" onclick="unlockAsTeacher()">👨‍🏫 Modo Docente: Practicar en Pantalla ➔</button>
            </div>
          </div>
        `;
        return;
      }
      startExam();
    }

    function startExam() {
      deck = EXAM_QUESTIONS.slice();
      idx = 0;
      answersState = deck.map(() => ({ resolved: false, hadErr: false }));
      document.getElementById('qStrip').style.display = 'flex';
      renderQ();
    }

    function renderStrip() {
      const strip = document.getElementById('qStrip');
      strip.innerHTML = deck.map((_, i) => {
        const st = answersState[i];
        let cls = 'q-dot';
        if (i === idx) cls += ' current';
        else if (st.resolved) cls += st.hadErr ? ' done-err' : ' done-ok';
        return `<button type="button" class="${cls}" onclick="goToQ(${i})" title="Ir al reactivo ${i + 1}">${i + 1}</button>`;
      }).join('');
    }

    function goToQ(newIdx) {
      if (newIdx < 0 || newIdx >= deck.length) return;
      idx = newIdx;
      renderQ();
    }

    function getCleanHitsCount() {
      return answersState.filter(s => s.resolved && !s.hadErr).length;
    }

    function renderQ() {
      renderStrip();
      const doneCount = answersState.filter(s => s.resolved).length;
      document.getElementById('pillProgress').textContent = `Reactivo ${idx + 1}/${deck.length} · Aciertos: ${getCleanHitsCount()}`;
      const q = deck[idx];
      const st = answersState[idx];

      document.getElementById('stageContainer').innerHTML = `
        <div class="stage-meta">
          <span class="campo-tag">${q.campo}</span>
          <span style="font-weight:900; color:#6d28d9; font-size:0.9rem;">${st.resolved ? '✅ Respondido' : `Resueltos: ${doneCount} de ${deck.length}`}</span>
        </div>
        <div class="q-split">
          <div class="visual-panel">${q.visualHtml}</div>
          <div>
            <h2 class="stage-prompt">${q.prompt}</h2>
            <div id="qBody"></div>
            <div id="feedbackBox" class="feedback-box ${st.resolved ? 'ok' : ''}">${st.resolved ? '✅ ' + q.okMsg : ''}</div>
          </div>
        </div>
        <div class="stage-footer">
          <button type="button" class="btn-sec" onclick="goToQ(${idx - 1})" ${idx === 0 ? 'disabled' : ''}>⬅ Anterior</button>
          <div id="stageActionSlot"></div>
          ${idx + 1 < deck.length
            ? `<button type="button" class="btn-primary" onclick="goToQ(${idx + 1})">Siguiente ➔</button>`
            : `<button type="button" class="btn-primary" style="background:#059669;" onclick="renderSummary()">📊 Ver Calificación Final ➔</button>`}
        </div>
      `;

      if (q.type === 'mcq') renderMcq(q, st);
      else if (q.type === 'match') renderMatch(q, st);
      else if (q.type === 'order') renderOrder(q, st);
      else if (q.type === 'commagaps') renderCommaGaps(q, st);
      else if (q.type === 'redcaps') renderRedCaps(q, st);
    }

    function showFb(ok, msg) {
      const fb = document.getElementById('feedbackBox');
      fb.className = 'feedback-box ' + (ok ? 'ok' : 'err');
      fb.textContent = msg;
      playSfx(ok ? 'ok' : 'err');
    }

    function markOk(q) {
      const st = answersState[idx];
      if (!st.resolved) {
        st.resolved = true;
      }
      renderStrip();
      document.getElementById('pillProgress').textContent = `Reactivo ${idx + 1}/${deck.length} · Aciertos: ${getCleanHitsCount()}`;
      showFb(true, '✅ ' + q.okMsg);
    }

    function renderMcq(q, st) {
      const body = document.getElementById('qBody');
      if (!q._opts) q._opts = shuffleArray(q.options);
      const opts = q._opts;
      body.innerHTML = `<div class="options-grid">${opts.map((o, i) => `
        <button type="button" class="opt-btn ${st.resolved && o.correct ? 'selected-correct' : ''}" data-i="${i}">
          <span class="opt-ico">${o.ico || '🔹'}</span>
          <span>${o.text}</span>
        </button>`).join('')}</div>`;
      body.querySelectorAll('.opt-btn').forEach((btn, i) => btn.addEventListener('click', () => {
        if (st.resolved) return;
        if (opts[i].correct) {
          btn.classList.add('selected-correct');
          markOk(q);
        } else {
          st.hadErr = true;
          btn.classList.add('selected-wrong');
          showFb(false, '💡 Observa la imagen de la izquierda e intenta otra opción.');
        }
      }));
    }

    function renderMatch(q, st) {
      const body = document.getElementById('qBody');
      const left = q.pairs.map((p, i) => ({ id: i, text: p.left }));
      if (!q._right) q._right = shuffleArray(q.pairs.map((p, i) => ({ id: i, text: p.right })));
      const right = q._right;
      let pickedLeft = null, solved = st.resolved ? q.pairs.length : 0;
      body.innerHTML = `<div class="match-columns">
        <div class="match-col" id="mL">${left.map(x => `<button type="button" class="match-btn ${st.resolved ? 'paired' : ''}" data-id="${x.id}">${x.text}</button>`).join('')}</div>
        <div class="match-col" id="mR">${right.map(x => `<button type="button" class="match-btn ${st.resolved ? 'paired' : ''}" data-id="${x.id}">${x.text}</button>`).join('')}</div>
      </div>`;
      if (st.resolved) return;
      body.querySelectorAll('#mL .match-btn').forEach(b => b.addEventListener('click', () => {
        if (b.classList.contains('paired')) return;
        body.querySelectorAll('#mL .match-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active'); pickedLeft = b;
      }));
      body.querySelectorAll('#mR .match-btn').forEach(r => r.addEventListener('click', () => {
        if (r.classList.contains('paired') || !pickedLeft) return;
        if (pickedLeft.dataset.id === r.dataset.id) {
          pickedLeft.classList.remove('active'); pickedLeft.classList.add('paired'); r.classList.add('paired');
          pickedLeft = null; solved++; playSfx('ok');
          if (solved === q.pairs.length) markOk(q);
        } else {
          st.hadErr = true; r.classList.add('wrong-flash');
          showFb(false, '💡 Esa pareja no corresponde. Intenta con otra.');
          setTimeout(() => r.classList.remove('wrong-flash'), 400);
        }
      }));
    }

    function renderOrder(q, st) {
      const body = document.getElementById('qBody');
      const indexed = q.steps.map((txt, i) => ({ idx: i, cleanTxt: txt.replace(/^\d+\.\s*/, '') }));
      if (!q._shuffled) q._shuffled = shuffleArray(indexed);
      const shuffled = q._shuffled;
      const chosen = st.resolved ? indexed.slice() : new Array(q.steps.length).fill(null);

      function draw() {
        body.innerHTML = `<div class="order-wrap">
          <div class="order-pool"><div style="font-weight:900;font-size:0.86rem;color:#475569;">Toca en orden:</div>${shuffled.map(item => {
            const used = chosen.some(c => c && c.idx === item.idx);
            return `<button type="button" class="seq-card ${used ? 'used' : ''}" ${used ? 'disabled' : ''} data-idx="${item.idx}">${item.cleanTxt}</button>`;
          }).join('')}</div>
          <div class="order-slots"><div style="font-weight:900;font-size:0.86rem;color:#5b21b6;">Orden 1° al 4° (toca para quitar):</div>${chosen.map((c, pos) => `
            <button type="button" class="seq-slot" data-pos="${pos}"><strong>${pos + 1}°.</strong> ${c ? c.cleanTxt : 'Vacío'}</button>`).join('')}</div>
        </div>`;
        if (st.resolved) return;
        body.querySelectorAll('.seq-card:not(.used)').forEach(btn => btn.addEventListener('click', () => {
          const fp = chosen.findIndex(x => x === null);
          if (fp !== -1) {
            chosen[fp] = shuffled.find(x => x.idx === Number(btn.dataset.idx));
            draw();
            if (chosen.every(x => x !== null)) checkNow();
          }
        }));
        body.querySelectorAll('.seq-slot').forEach(btn => btn.addEventListener('click', () => {
          const p = Number(btn.dataset.pos);
          if (chosen[p]) { chosen[p] = null; draw(); }
        }));
      }

      function checkNow() {
        if (chosen.every((c, pos) => c && c.idx === pos)) {
          markOk(q);
        } else {
          st.hadErr = true;
          showFb(false, '💡 Algún paso no está en orden. Toca un paso morado para quitarlo y corregirlo.');
        }
      }
      draw();
    }

    function renderCommaGaps(q, st) {
      const body = document.getElementById('qBody');
      const activeGaps = new Set(st.resolved ? q.commaAfter : []);
      function draw() {
        let html = '<div class="token-box">';
        q.segments.forEach((seg, i) => {
          html += `<span>${seg}</span>`;
          if (i < q.segments.length - 1) {
            const on = activeGaps.has(i);
            html += `<button type="button" class="comma-slot ${on ? 'active' : ''}" data-g="${i}">${on ? ',' : '+'}</button>`;
          }
        });
        html += '</div>';
        body.innerHTML = html;
        if (st.resolved) return;
        body.querySelectorAll('.comma-slot').forEach(btn => btn.addEventListener('click', () => {
          const g = Number(btn.dataset.g);
          if (activeGaps.has(g)) activeGaps.delete(g); else activeGaps.add(g);
          draw();
        }));
        document.getElementById('stageActionSlot').innerHTML = `<button type="button" class="btn-primary" id="btnCheckCommas">✓ Comprobar comas</button>`;
        document.getElementById('btnCheckCommas').addEventListener('click', () => {
          const ok = q.segments.slice(0, -1).every((_, i) => q.commaAfter.includes(i) === activeGaps.has(i));
          if (ok) { document.getElementById('stageActionSlot').innerHTML = ''; markOk(q); }
          else { st.hadErr = true; showFb(false, '💡 Recuerda: pon coma entre colores, pero NO pongas coma antes de "y azul".'); }
        });
      }
      draw();
    }

    function renderRedCaps(q, st) {
      const body = document.getElementById('qBody');
      const marked = new Set(st.resolved ? q.tokens.map((t, i) => t.needsCap ? i : -1).filter(i => i >= 0) : []);
      function draw() {
        body.innerHTML = `<div class="token-box">${q.tokens.map((tk, i) => {
          const on = marked.has(i);
          const label = on ? `<span class="red-cap">${tk.text[0].toUpperCase()}</span>${tk.text.slice(1)}` : tk.text;
          return `<button type="button" class="word-token ${on ? 'marked-red' : ''}" data-i="${i}">${label}</button>`;
        }).join('')}</div>`;
        if (st.resolved) return;
        body.querySelectorAll('.word-token').forEach(btn => btn.addEventListener('click', () => {
          const i = Number(btn.dataset.i);
          if (marked.has(i)) marked.delete(i); else marked.add(i);
          draw();
        }));
        document.getElementById('stageActionSlot').innerHTML = `<button type="button" class="btn-primary" id="btnCheckCaps">✓ Comprobar mayúsculas</button>`;
        document.getElementById('btnCheckCaps').addEventListener('click', () => {
          const ok = q.tokens.every((tk, i) => Boolean(tk.needsCap) === marked.has(i));
          if (ok) { document.getElementById('stageActionSlot').innerHTML = ''; markOk(q); }
          else { st.hadErr = true; showFb(false, '💡 Marca solo el nombre, el apellido y el municipio (Alexander, Gómez, Sayula).'); }
        });
      }
      draw();
    }

    function renderSummary() {
      const total = deck.length, cleanHits = getCleanHitsCount();
      const pct = Math.round((cleanHits / total) * 100);
      const saved = saveExamProgress(cleanHits, total);
      const campoStats = {};
      deck.forEach((q, i) => {
        if (!campoStats[q.campo]) campoStats[q.campo] = { ok: 0, total: 0 };
        campoStats[q.campo].total++;
        if (answersState[i].resolved && !answersState[i].hadErr) campoStats[q.campo].ok++;
      });
      playSfx('win');
      document.getElementById('stageContainer').innerHTML = `
        <h2 class="stage-prompt">🏆 Resultado del Simulador · Proyecto 4</h2>
        <p style="font-size:1.05rem; color:#334155; margin-bottom:0.85rem;">Lograste <strong>${cleanHits} de ${total}</strong> reactivos al primer intento (<strong>${pct}%</strong>). Mejor marca guardada: <strong>${saved.bestPct}%</strong>.</p>
        <div class="campos-grid">
          ${Object.entries(campoStats).map(([campo, s]) => `<div class="campo-box"><h4>${campo}</h4><p style="font-weight:900; font-size:1.1rem; color:${s.ok === s.total ? '#059669' : '#d97706'}; margin-top:0.25rem;">${s.ok} / ${s.total} aciertos</p></div>`).join('')}
        </div>
        <div class="stage-footer">
          <button type="button" class="btn-primary" onclick="startExam()">🔁 Volver a practicar</button>
          <a class="btn-nav" href="../../index.html" style="background:#334155;">⬅ Volver al Portal</a>
        </div>
      `;
    }

    initUiClickSfx();
    checkUnlockAndStart();
  </script>
</body>
</html>
