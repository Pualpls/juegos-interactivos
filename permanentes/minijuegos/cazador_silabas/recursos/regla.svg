<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
      <rect width="200" height="200" rx="20" fill="#fefce8"/>
      <!-- Regla de 30 cm con marcas -->
      <g transform="rotate(-30 100 100)">
        <rect x="35" y="80" width="130" height="35" rx="4" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
        <!-- Marcas de centímetros -->
        <line x1="50" y1="80" x2="50" y2="95" stroke="#713f12" stroke-width="2"/>
        <line x1="65" y1="80" x2="65" y2="90" stroke="#713f12" stroke-width="1.5"/>
        <line x1="80" y1="80" x2="80" y2="95" stroke="#713f12" stroke-width="2"/>
        <line x1="95" y1="80" x2="95" y2="90" stroke="#713f12" stroke-width="1.5"/>
        <line x1="110" y1="80" x2="110" y2="95" stroke="#713f12" stroke-width="2"/>
        <line x1="125" y1="80" x2="125" y2="90" stroke="#713f12" stroke-width="1.5"/>
        <line x1="140" y1="80" x2="140" y2="95" stroke="#713f12" stroke-width="2"/>
      </g>
    </svg>