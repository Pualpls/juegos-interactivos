<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#ffffff" rx="24"/>
  <g transform="rotate(45 100 100)">
    <!-- Tubo de vidrio -->
    <rect x="90" y="25" width="20" height="110" rx="10" fill="#e0f2fe" stroke="#38bdf8" stroke-width="4"/>
    <!-- Bulbo inferior -->
    <circle cx="100" cy="145" r="24" fill="#ef4444" stroke="#b91c1c" stroke-width="4"/>
    <!-- Columna de mercurio roja -->
    <rect x="96" y="65" width="8" height="70" rx="4" fill="#ef4444"/>
    <circle cx="100" cy="145" r="18" fill="#ef4444"/>
    <!-- Escala graduada -->
    <line x1="84" y1="45" x2="90" y2="45" stroke="#0284c7" stroke-width="2.5"/>
    <line x1="80" y1="60" x2="90" y2="60" stroke="#0284c7" stroke-width="3"/>
    <line x1="84" y1="75" x2="90" y2="75" stroke="#0284c7" stroke-width="2.5"/>
    <line x1="80" y1="90" x2="90" y2="90" stroke="#0284c7" stroke-width="3"/>
    <line x1="84" y1="105" x2="90" y2="105" stroke="#0284c7" stroke-width="2.5"/>
    <line x1="80" y1="120" x2="90" y2="120" stroke="#0284c7" stroke-width="3"/>
    <!-- Brillo del bulbo -->
    <circle cx="94" cy="140" r="5" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>